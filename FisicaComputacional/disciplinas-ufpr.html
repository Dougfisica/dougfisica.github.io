            { semestre: "", codigo: "", disciplina: "Atividades Formativas", carga_horaria: 45, tipo: "Atividades Formativas" }
        ];

        const disciplineSummaries = {
            "Física I": "Constrói a base da mecânica clássica: movimento, vetores, forças, energia e colisões. É a disciplina que organiza a intuição física em leis quantitativas e problemas resolvíveis.",

            "Física II": "Avança da mecânica translacional para rotações, fluidos, oscilações, ondas e termodinâmica. Mostra como diferentes fenômenos podem ser descritos por princípios físicos gerais.",

            "Divulgação Científica": "Discute como a ciência circula fora da sala de aula e como produzir conteúdo para públicos diferentes. A disciplina reforça comunicação, mediação e responsabilidade pública da ciência.",
            "Interações Culturais Ambientais e Humanísticas": "Amplia a formação com discussões sobre cultura, diversidade, direitos humanos e sustentabilidade. É um componente pensado para situar a formação científica dentro da sociedade.",
            "Física III": "Desenvolve eletrostática, circuitos, magnetismo, indução e as ideias que culminam nas equações de Maxwell. É o núcleo do eletromagnetismo clássico no curso.",
            "Física Experimental III": "Traduz conceitos de eletricidade e magnetismo em montagens e medições concretas. O estudante vê como circuitos, indução e campos se manifestam em situações reais de laboratório.",
            "Estatística II": "Sai da estatística descritiva e entra em probabilidade, distribuições, inferência, regressão e ANOVA. É a disciplina que prepara o terreno para análise quantitativa mais séria e para machine learning.",

            "Algoritmos e Estruturas de Dados III": "Introduz análise de complexidade, árvores e tabelas hash. A disciplina ajuda a comparar soluções computacionais não só por funcionar, mas por eficiência.",
            "Práticas de Empreendedorismo": "Conecta inovação, modelo de negócio, viabilidade econômica e planejamento. A proposta é mostrar como transformar conhecimento técnico em projeto com valor real.",
            "Química Geral Teórica": "Oferece a base química necessária para entender estrutura da matéria, ligações, reações, cinética e equilíbrio. Isso amplia o repertório para materiais, biofísica e temas interdisciplinares.",

            "Equações Diferenciais Aplicadas à Física": "Foca nas equações diferenciais que aparecem o tempo todo na modelagem física. O aluno aprende a reconhecer, resolver e aplicar esses modelos em contextos concretos.",
            "Inferência Bayesiana": "Apresenta a lógica bayesiana para atualizar crenças com dados. É uma disciplina importante para quem quer trabalhar com estatística moderna, modelagem probabilística e tomada de decisão.",

            "Mecânica Clássica": "Reorganiza a mecânica em um nível mais sofisticado, com sistemas de partículas, oscilações, gravitação e formulações de Lagrange e Hamilton. É uma disciplina de maturidade conceitual no curso.",
            "Eletromagnetismo": "Aprofunda o formalismo matemático do campo eletromagnético com operadores vetoriais, meios materiais e equações de Maxwell. Aqui a teoria ganha uma cara mais completa e elegante.",
            "Física Matemática": "Trabalha variáveis complexas e ferramentas como séries e transformadas de Fourier. Essas técnicas são fundamentais para resolver problemas em ondas, quântica, sinais e métodos teóricos.",
            "Dinâmica Molecular e Aprendizado de Máquina em Física de Materiais": "Une simulação atomística e técnicas de machine learning para estudar materiais. É uma disciplina com perfil fortemente aplicado e muito alinhada à pesquisa contemporânea.",
            "Teoria dos Grafos": "Apresenta grafos como linguagem para modelar redes e relações, além de algoritmos clássicos de busca, coloração e árvore geradora. É útil tanto em computação quanto em problemas científicos complexos.",
            "Aprendizagem de Máquina": "Cobre os pilares de aprendizado supervisionado e não supervisionado, incluindo regressão, classificação, agrupamento e associação. A disciplina mostra como extrair estrutura e previsão a partir de dados.",
            "Física Moderna": "Introduz os fenômenos que romperam com a física clássica, como relatividade, efeito fotoelétrico, quantização e o átomo de hidrogênio. É a base conceitual para quântica e física contemporânea.",
            "Biofísica Molecular Computacional": "Conecta biologia molecular com modelagem computacional de biomoléculas. A disciplina mostra como ferramentas de simulação ajudam a estudar estruturas e interações em sistemas biológicos.",
            "Computação de Alto Desempenho": "Apresenta arquiteturas paralelas, fundamentos de HPC e medição de desempenho. É a disciplina que prepara o aluno para rodar simulações e processamento pesado em escala maior.",
            "Engenharia de Dados": "Passa por coleta, limpeza, transformação e processamento massivo de dados, incluindo NoSQL e computação distribuída. É um componente voltado para pipelines e infraestrutura analítica.",
            "Redes Neurais Artificiais": "Percorre da história do perceptron até redes multicamadas, backpropagation e deep learning. A disciplina dá a base neural para aplicações modernas de IA.",
            "Trabalho de Conclusão de Curso I": "Marca o início do TCC, com definição do problema, organização da pesquisa e construção das primeiras etapas do projeto. É onde o aluno começa a consolidar autonomia acadêmica ou técnica.",
            "Optativa 1": "Espaço flexível da matriz para aprofundamento em um tema de interesse. A ideia é permitir personalização da formação conforme a trilha acadêmica ou profissional escolhida.",
            "Termodinâmica e Física Estatística": "Integra leis da termodinâmica, potenciais termodinâmicos, transições de fase e descrição estatística de sistemas físicos. É uma ponte importante entre fenômenos macroscópicos e visão microscópica.",
            "Mecânica Quântica": "Apresenta função de onda, equação de Schrödinger e o formalismo básico da teoria quântica. É o primeiro mergulho sistemático na física dos sistemas microscópicos.",
            "Física do Estado Sólido": "Estuda cristais, rede recíproca, fônons, bandas de energia, semicondutores, magnetismo e supercondutividade. É uma disciplina central para materiais e matéria condensada.",
            "Simulação Computacional de Primeiros Princípios": "Explora métodos ab initio, especialmente DFT, para calcular propriedades eletrônicas e vibracionais de materiais. É um curso com forte perfil de pesquisa computacional avançada.",
            "Trabalho de Conclusão de Curso II": "Conclui o TCC com desenvolvimento final, entrega de produto acadêmico ou técnico e fechamento formal do trabalho. É o momento de transformar pesquisa em resultado apresentável.",
            "Optativa 2": "Segundo espaço de escolha livre na matriz, pensado para aprofundar competências específicas ou complementar a trilha de pesquisa e aplicação do aluno.",
            "Atividades Formativas": "Reúne experiências extracurriculares validadas pelo curso, como eventos, extensão, pesquisa e outras atividades acadêmicas relevantes. O objetivo é ampliar a formação para além das disciplinas formais."
        };

        const state = {
            semester: "Todos"
        };

        const semesterFilters = document.getElementById("semester-filters");
        const catalogRoot = document.getElementById("catalog-root");
        const modal = document.getElementById("discipline-modal");
        const modalTitle = document.getElementById("discipline-modal-title");
        const modalMeta = document.getElementById("discipline-modal-meta");
        const modalCopy = document.getElementById("discipline-modal-copy");
        const modalClose = document.getElementById("discipline-modal-close");

        const semesterOrder = ["1", "2", "3", "4", "5", "6", "7", ""];
        const semesterLabels = {
            "1": "1º semestre",
            "2": "2º semestre",
            "3": "3º semestre",
            "4": "4º semestre",
            "5": "5º semestre",
            "6": "6º semestre",
            "7": "7º semestre",
            "": "Formação complementar"
        };

        function slugify(value) {
            return value
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-|-$/g, "");
        }

        function getSemesters() {
            return ["Todos", ...semesterOrder.filter((semester) => disciplines.some((item) => item.semestre === semester))];
        }

        function formatSemesterLabel(value) {
            return semesterLabels[value] || `${value}º semestre`;
        }

        function getFilteredDisciplines() {
            return disciplines.filter((item) => {
                const matchesSemester = state.semester === "Todos" || item.semestre === state.semester;
                return matchesSemester;
            });
        }

        function renderSemesterFilters() {
            semesterFilters.innerHTML = getSemesters().map((semester) => {
                const label = semester === "Todos" ? "Todos" : semester || "+";
                return `
                    <button class="semester-btn${state.semester === semester ? " is-active" : ""}" type="button" data-semester="${semester}">
                        ${label}
                    </button>
                `;
            }).join("");
        }

        function renderCatalog() {
            const filtered = getFilteredDisciplines();

            if (!filtered.length) {
                catalogRoot.innerHTML = `
                    <div class="empty-state">
                        Nenhuma disciplina encontrada com esse filtro. Ajuste a busca ou volte para <strong>Todos</strong>.
                    </div>
                `;
                return;
            }

            const groups = semesterOrder
                .map((semester) => {
                    const items = filtered.filter((item) => item.semestre === semester);
                    if (!items.length) {
                        return "";
                    }

                    const totalHours = items.reduce((sum, item) => sum + item.carga_horaria, 0);
                    const visualIndex = semester ? semester : "∞";
                    return `
                        <section class="semester-group">
                            <div class="semester-header">
                                <div class="semester-title">
                                    <div class="semester-index">${visualIndex}</div>
                                    <div>
                                        <h2>${formatSemesterLabel(semester)}</h2>
                                        <div class="semester-meta">${items.length} disciplina${items.length === 1 ? "" : "s"} • ${totalHours}h</div>
                                    </div>
                                </div>
                            </div>
                            <div class="course-grid">
                                ${items.map((item) => `
                                    <article
                                        class="course-card"
                                        tabindex="0"
                                        role="button"
                                        aria-label="Abrir resumo de ${item.disciplina}"
                                        data-discipline="${item.disciplina}"
                                        data-code="${item.codigo || "SEM CÓDIGO"}"
                                        data-type="${item.tipo}"
                                        data-semester="${formatSemesterLabel(item.semestre)}"
                                        data-hours="${item.carga_horaria}h"
                                    >
                                        <div class="course-top">
                                            <span class="course-code">${item.codigo || "SEM CÓDIGO"}</span>
                                            <span class="course-hours">${item.carga_horaria}h</span>
                                        </div>
                                        <h3>${item.disciplina}</h3>
                                        <span class="type-tag type-${slugify(item.tipo)}">${item.tipo}</span>
                                        <span class="course-hint">Clique para ver resumo</span>
                                    </article>
                                `).join("")}
                            </div>
                        </section>
                    `;
                })
                .join("");

            catalogRoot.innerHTML = groups;
        }

        function openDisciplineModal(card) {
            const name = card.dataset.discipline;
            const summary = disciplineSummaries[name] || "Resumo em preparação a partir do PPC do curso.";
            const metaItems = [
                card.dataset.code,
                card.dataset.semester,
                card.dataset.type,
                card.dataset.hours
            ];

            modalTitle.textContent = name;
            modalCopy.textContent = summary;
            modalMeta.innerHTML = metaItems.map((item) => `<span class="discipline-meta-pill">${item}</span>`).join("");
            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }

        function closeDisciplineModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
            document.body.style.overflow = "";
        }

        function renderAll() {
            renderSemesterFilters();
            renderCatalog();
        }

        semesterFilters.addEventListener("click", (event) => {
            const button = event.target.closest("[data-semester]");
            if (!button) {
                return;
            }

            state.semester = button.dataset.semester;
            renderAll();
        });

        catalogRoot.addEventListener("click", (event) => {
            const card = event.target.closest(".course-card");
            if (!card) {
                return;
            }

            openDisciplineModal(card);
        });

        catalogRoot.addEventListener("keydown", (event) => {
            const card = event.target.closest(".course-card");
            if (!card) {
                return;
            }

            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openDisciplineModal(card);
            }
        });

        modalClose.addEventListener("click", closeDisciplineModal);

        modal.addEventListener("click", (event) => {
            if (event.target === modal) {
                closeDisciplineModal();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && modal.classList.contains("is-open")) {
                closeDisciplineModal();
            }
        });

        renderAll();
    </script>
</body>
</html>
