        ['MISC-003',/^\[MISC-003\]/,'O horário não respeita os turnos permitidos para a disciplina.','Confira os turnos no cadastro da disciplina.'],
        ['DISTRIBUTION',/^(\[MISC-004\]|Distribuição|Dias semanais|Número de dias|Limite de dias|Reserve|São necessários)/,'A quantidade de dias ou a divisão diária obrigatória impede este horário.','Revise as aulas já alocadas e a divisão obrigatória entre dias.'],
        ['MISC-006',/^\[MISC-006\]/,'As aulas da disciplina no dia precisam formar um bloco contínuo.','Reserve horários seguidos no mesmo turno ou reorganize as aulas já alocadas.'],
        ['LOAD',/^Carga docente excedida/,'A carga semanal do docente seria excedida.','Confira a carga máxima e as disciplinas atribuídas ao docente.'],

}</td><td></td></tr></tfoot></table>`:'<div class="pending-summary-empty"><strong>Nenhuma disciplina marcada como Não alocar ou com 100% da carga EaD.</strong><p>Não há ofertas com esses critérios na base atual.</p></div>'}<footer class="report-footer"><span>Carga semanal em horas-aula de 60 minutos. A CH EaD já está incluída na CH total.</span><span>As ofertas desta lista não geram pendências de ensalamento.</span></footer></article>`;

    function getPrintDocuments(mode=ui.printMode,courseId=ui.printCourseId,includeEmptyPeriods=ui.printEmptyPeriods,s=state){
      const build=(key,kind,title,subtitle,classes,professor=null)=>{
        const ids=new Set(classes.map(c=>c.id)),allocations=s.allocations.filter(a=>ids.has(a.classId));
        const pending=classes.reduce((n,c)=>n+remaining(c.id,s),0);
        return {key,kind,title,subtitle,classes,professor,allocations,pending};
      };
      if(mode==='pending')return [pendingSummaryPrintDocument(s)];
      if(mode==='unscheduled')return [unscheduledPrintDocument(s)];
      if(mode==='professors'){
        const documents=[],withoutLoad=[];
        for(const professor of [...s.professors].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')||a.id.localeCompare(b.id))){
          const classes=s.classes.filter(c=>c.professorId===professor.id),totalHours=classes.reduce((sum,c)=>sum+c.weeklySlotsRequired,0);
          if(totalHours>0)documents.push(build(`professor_${professor.id}`,'professor',professor.name,[professor.department,professor.siape?`SIAPE ${professor.siape}`:''].filter(Boolean).join(' · '),classes,professor));else withoutLoad.push(professor);
        }
        if(withoutLoad.length)documents.push({key:'professors_without_load',kind:'zero-load-professors',title:'Docentes sem carga horária',subtitle:'Docentes com CH semanal total igual a zero na base atual',professors:withoutLoad,classes:[],allocations:[],pending:0});
        return documents;
      }
      if(mode==='all-courses')return [...s.courses].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')||a.code.localeCompare(b.code,'pt-BR')||a.id.localeCompare(b.id)).flatMap(course=>getPrintDocuments('course',course.id,false,s));
      if(mode!=='course')return [];
      const course=byId('courses',courseId,s);if(!course)return [];
      const classes=s.classes.filter(c=>classBelongsTo(c,courseId));
      const periods=includeEmptyPeriods?Array.from({length:10},(_,i)=>i+1):[...new Set(classes.flatMap(c=>classOfferings(c).filter(member=>member.courseId===courseId).map(member=>member.period)))].sort((a,b)=>a-b);
      return periods.map(period=>({...build(`course_${course.id}_${period}`,'course',`${course.name} · ${period}º período`,`${course.code} · Todas as turmas do período`,classes.filter(c=>classBelongsTo(c,courseId,period))),courseId,period}));
    }

    function renderZeroLoadProfessorsPrint(doc,index,total){

    function renderPrintDocument(doc,index,total){

      const cells=new Map();for(const a of doc.allocations){const key=`${a.day}_${a.slot}`;if(!cells.has(key))cells.set(key,[]);cells.get(key).push(a);}

            return `<div class="report-class ${issue?'report-class-issue':''}" style="${themeStyle(c)}"><strong>${esc(audience.code)}${esc(label)}${issue?' ⚠':''}</strong>${coursePrint?`<span class="report-professor">${esc(professor?.name||'Docente a definir')}</span>`:''}<span>${esc(room?.code)} · ${esc(room?.building)}</span></div>`;

      return `<article class="report-sheet" data-report-key="${esc(doc.key)}"><header class="report-header"><div><div class="report-institution">UNIVERSIDADE FEDERAL DO PARANÁ</div><p>SADE · Gestão de Alocação Didática · Semestre ${esc(ui.semester)}</p><h3>${esc(doc.title)}</h3>${doc.subtitle?`<p>${esc(doc.subtitle)}</p>`:''}</div><div class="report-number"><strong>${doc.kind==='professor'?'Agenda docente':'Grade do curso'}</strong><span>${doc.kind==='professor'?'Documento':'Grade'} ${index+1} de ${total}</span><span>${doc.allocations.length} aula(s) alocada(s) · ${doc.pending} pendente(s)</span></div></header>${renderPrintPending(doc)}${!doc.allocations.length?`<p class="report-empty-note">Nenhuma aula alocada nesta grade.${doc.kind==='course'?'':' A legenda abaixo identifica a carga das disciplinas, os saldos de ensalamento e os componentes sem horário fixo.'}</p>`:''}<table class="report-grid"><caption class="sr-only">${esc(doc.title)} · Horários de segunda a sábado</caption><colgroup><col class="report-time-column">${DAYS.map(()=>'<col>').join('')}</colgroup><thead><tr><th scope="col">Horário</th>${DAYS.map(day=>`<th scope="col">${day.name}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${doc.kind==='course'?'':`<section class="report-legend"><h4>Disciplinas e carga semanal</h4>${classes.length?`<div class="report-subjects">${classes.map(c=>{
        const count=classCount(c.id),balance=remaining(c.id),course=classCourse(c),professor=byId('professors',c.professorId);
        return `<div class="report-subject"><strong>${esc(c.code)} · ${esc(c.name)} · ${esc(c.turma)}</strong>${eadHours(c)?`<span>${c.weeklySlotsRequired}h totais · ${presentialHours(c)}h presenciais · ${eadHours(c)}h EaD sem horário fixo</span>`:''}${c.requiredRoomId?`<span>${esc(specificRoomLabel(c))}</span>`:''}${c.teachingComponent?`<span>${esc(teachingPartLabel(c))} · ${c.enrolledStudents} alunos · ${c.teachingComponent.sourceClass.weeklySlotsRequired}h por aluno na disciplina completa</span>`:''}${c.joinedClasses?`<span>Turmas reunidas: ${c.joinedClasses.map(member=>esc(member.code+' · '+member.name+' · '+classMembershipLabel(member))).join('; ')}</span>`:''}<span>${doc.kind==='professor'?`${esc(hasSharedOfferings(c)?classMembershipLabel(c):course?.name)}${hasSharedOfferings(c)?'':` · ${c.period}º período`}`:esc(professor?.name)} · ${c.doNotAllocate?`${c.weeklySlotsRequired} h/semana · Não alocar · sem horário fixo e sem sala`:!hasScheduledTeaching(c)?`${c.weeklySlotsRequired} h/semana · 100% EaD · sem sala nem horário`:`${count}/${scheduledHours(c)} aula(s) alocada(s)`}${balance?` · ${balance} pendente(s)`:''}</span></div>`;
      }).join('')}</div>`:'<p>Nenhuma disciplina cadastrada para este docente ou período.</p>'}</section><footer class="report-footer"><span>Semana recorrente · Aulas de 60 minutos · Manhã, tarde e noite</span><span>${issues?`⚠ ${issues} alocação(ões) com conflito ou alerta. Consulte a auditoria.`:'Horários conforme a grade atual do SADE.'}</span></footer>`}</article>`;
    }
    function renderPrinting(){
      const isPending=ui.printMode==='pending',isUnscheduled=ui.printMode==='unscheduled',isSummary=isPending||isUnscheduled,documents=getPrintDocuments();ui.printPreview=Math.max(0,Math.min(ui.printPreview,documents.length-1));
      const uniqueClasses=[...new Map(documents.flatMap(d=>d.classes).map(c=>[c.id,c])).values()],allocated=new Set(documents.flatMap(d=>d.allocations).map(a=>a.id)).size,pending=uniqueClasses.reduce((n,c)=>n+remaining(c.id),0),doc=documents[ui.printPreview];

      return `<section class="page printing-page" data-scroll="printing"><div class="title-line"><div><div class="eyebrow" style="margin-bottom:8px">Relatórios acadêmicos</div><h2>Impressões</h2><p class="description">Imprima ou gere um XLSX das grades, das pendências ou das disciplinas Não alocar / 100% EaD.</p></div><div class="head-actions"><button class="btn" data-action="export-print-xlsx" ${documents.length?'':'disabled'}>${icon('download')}Gerar XLSX</button><button class="btn primary" data-action="print" ${documents.length?'':'disabled'}>${icon('printer')}${isUnscheduled?'Imprimir relatório':isPending?'Imprimir resumo':gradeCount?`Imprimir ${gradeCount} grade(s)${zeroLoadCount?' + lista':''}`:zeroLoadCount?'Imprimir lista':`Imprimir ${documents.length} grade(s)`}</button></div></div><div class="print-options panel"><div class="print-mode-options" role="group" aria-label="Tipo de impressão">${[['professors','users','Todos os docentes','Grades dos docentes com CH e lista final dos docentes sem carga.'],['course','book','Curso completo','Uma grade para cada período, com todas as turmas.'],['all-courses','layers','Todos os cursos e períodos','Impressão em lote, somente dos períodos com disciplinas.'],['pending','list','Resumo de disciplinas pendentes','Carga a alocar, responsáveis e motivos da auditoria.'],['unscheduled','book','Não alocar / 100% EaD','Disciplinas dispensadas de sala e horário, com docentes e carga semanal.']].map(([id,ic,title,description])=>`<button class="print-mode ${ui.printMode===id?'active':''}" data-action="print-mode" data-value="${id}" aria-pressed="${ui.printMode===id}">${icon(ic)}<span><strong>${title}</strong><small>${description}</small></span>${ui.printMode===id?icon('checkCircle'):''}</button>`).join('')}</div>${ui.printMode==='course'?`<div class="print-course-controls"><label class="field">Curso<select id="print-course" ${state.courses.length?'':'disabled'}>${state.courses.length?options(state.courses.map(c=>[c.id,c.name]),ui.printCourseId):'<option value="">Nenhum curso cadastrado</option>'}</select></label><label class="print-empty-option"><input type="checkbox" id="print-empty-periods" ${ui.printEmptyPeriods?'checked':''}>Incluir também períodos sem disciplinas (1º ao 10º)</label></div>`:ui.printMode==='all-courses'?'<p class="print-options-note">Todos os cursos em ordem alfabética, com os períodos em ordem numérica. Períodos sem nenhuma disciplina e cursos sem disciplinas são pulados automaticamente. Disciplinas cadastradas ainda sem horário alocado permanecem no relatório.</p>':isUnscheduled?'<p class="print-options-note">Relatório separado das ofertas marcadas como Não alocar ou integralmente EaD, com cursos, períodos, docentes e carga semanal. As ofertas que atendem aos dois critérios aparecem uma única vez. A CH EaD já está incluída na CH total.</p>':isPending?'<p class="print-options-note">Resumo de todas as disciplinas com aulas presenciais ainda pendentes, incluindo alocações parciais. Disciplinas completas, Não alocar e CH EaD ficam fora do saldo. Os motivos são recalculados a partir da grade atual.</p>':'<p class="print-options-note">Somente docentes com CH total maior que zero têm grade individual, em ordem alfabética, mesmo quando suas aulas ainda estão pendentes. A CH inclui EaD e ofertas Não alocar. Docentes sem carga são listados ao final; suas grades vazias não são impressas.</p>'}</div><div class="print-summary"><span>${icon('layers')}<strong>${isSummary?doc?.items.length||0:gradeCount}</strong> ${isSummary?'disciplina(s)/componente(s)':`grade(s)${zeroLoadCount?' + lista final de '+zeroLoadCount+' docente(s) sem CH':''}`}</span><span>${icon('calendar')}<strong>${isUnscheduled?doc?.totalHours||0:allocated}</strong> ${isUnscheduled?'h de CH total':isPending?'aula(s) já alocada(s) nesses itens':'aula(s) alocada(s)'}</span><span>${icon('clock')}<strong>${isUnscheduled?doc?.eadTotalHours||0:pending}</strong> ${isUnscheduled?'h EaD (incluídas na CH total)':'aula(s) pendente(s)'}</span><span class="print-paper-hint">${isSummary?'A4 paisagem · resumo completo com paginação automática':'A4 paisagem · cada grade começa em uma nova página'}</span></div>${doc?`<div class="print-preview-toolbar"><div><strong>Prévia da impressão</strong><span>${zeroLoadCount?`A impressão inclui ${gradeCount} grade(s) e, ao final, a lista de ${zeroLoadCount} docente(s) sem carga horária.`:isUnscheduled?'A impressão inclui todas as ofertas Não alocar / 100% EaD, com paginação automática.':isPending?'A impressão inclui todos os itens pendentes, mesmo quando o resumo ocupa várias páginas.':`A impressão inclui todas as ${documents.length} grades do relatório.`}</span></div><div class="print-preview-navigation"><button class="icon-btn" data-action="print-page" data-value="-1" ${ui.printPreview?'':'disabled'} aria-label="Grade anterior"><span class="print-prev">${icon('chevron')}</span></button><label class="sr-only" for="print-preview-select">Grade da prévia</label><select class="select-control" id="print-preview-select">${options(documents.map((d,i)=>[i,`${i+1} / ${documents.length} · ${d.title}`]),ui.printPreview)}</select><button class="icon-btn" data-action="print-page" data-value="1" ${ui.printPreview<documents.length-1?'':'disabled'} aria-label="Próxima grade">${icon('chevron')}</button></div></div><div class="report-preview" data-scroll="print-preview">${renderPrintDocument(doc,ui.printPreview,documents.length)}</div>`:`<div class="empty-state">${icon('printer')}<h3>${ui.printMode==='professors'?'Nenhum docente cadastrado.':ui.printMode==='all-courses'?'Nenhum curso com disciplinas cadastradas.':'Nenhuma disciplina neste curso.'}</h3><p>${ui.printMode==='professors'?'Cadastre os docentes para gerar suas agendas.':ui.printMode==='all-courses'?'Cadastre cursos e disciplinas para gerar a impressão em lote.':'Selecione outro curso, cadastre disciplinas ou inclua os períodos sem disciplinas.'}</p><button class="btn" data-action="tab" data-value="register">Abrir ca     function renderSidebar(){const demands=filteredDemands(),incomplete=state.classes.filter(c=>remaining(c.id)>0).length;return `<aside class="sidebar ${ui.sidebarOpen?'open':''}" aria-label="Bandeja de demandas"><div class="sidebar-head"><div class="section-title">Demandas didáticas <span class="count">${incomplete} pendentes</span><button class="icon-btn sidebar-dismiss" style="display:none" data-action="toggle-sidebar" aria-label="Fechar bandeja">${icon('x')}</button></div><p class="description">Arraste uma disciplina ou selecione e clique na grade.</p><div class="search">${icon('search')}<input id="demand-search" placeholder="Buscar disciplina ou docente..." aria-label="Buscar disciplina ou docente" value="${esc(ui.search)}" autocomplete="off"></div><div class="filters">${[['all','Todas'],['incomplete','Incompletas'],['complete','Completas'],['lab','Laboratório']].map(([id,label])=>`<button class="filter-pill ${ui.filter===id?'active':''}" data-action="filter" data-value="${id}" aria-pressed="${ui.filter===id}">${label}</button>`).join('')}</div></div><div class="demand-list" data-scroll="demands" id="demand-list">${demands.length?demands.map(renderDemandCard).join(''):`<div class="empty-state">${icon('search')}<h3>Nenhuma disciplina encontrada</h3><p>Tente outra busca ou altere o filtro.</p>${!state.classes.length?'<button class="btn" data-action="new-class">Cadastrar disciplina</button>':''}</div>`}</div><div class="sidebar-foot">${icon('info')}<span>Uma aula corresponde a <strong>60 minutos</strong>.<br>Os saldos são atualizados a cada alocação.</span></div></aside>`;}

      if(!pending.length)return `<div class="audit-ok">${icon('checkCircle')}<h3>Nenhuma disciplina pendente.</h3><p>Toda a demanda semanal está alocada. Confira também os conflitos e alertas.</p></div>`;
      return `<div class="pending-heading"><div><h3>Disciplinas com aulas pendentes <span class="count">${pending.length}</span></h3><p>Diagnóstico da grade atual. Os horários possíveis são avaliados individualmente; a heurística não garante encontrar uma solução completa.</p></div><button class="btn small" data-action="auto">${icon('sparkles')}Tentar autopreencher</button></div><div class="note" style="margin-bottom:14px">${icon('info')}<div>O autopreenchimento usa salas com tipo, capacidade e recursos adequados e evita alertas de carga e condições de ensino. MISC-001 e MISC-002 podem ser confirmadas manualmente na grade; a confirmação mantém o alerta na auditoria. A regra de espaçamento MISC-005 é opcional e não bloqueia estes encaixes. Os diagnósticos são recalculados quando a grade ou os cadastros mudam.</div></div><div class="audit-list">${pending.map(item=>{
        const c=item.class,example=item.example;
        return `<article class="audit-item pending-item" data-pending-class="${esc(c.id)}"><div class="audit-icon">${icon('clock')}</div><div class="audit-text"><div class="pending-title"><h3>${esc(c.code)} · ${esc(c.name)} · ${esc(c.turma)}</h3><span class="tag">${item.pending} aula(s) pendente(s) · ${item.allocated}/${scheduledHours(c)} alocadas</span></div><p class="pending-status">${esc(item.summary)}</p>${item.reasons.slice(0,2).map(reason=>`<p>${esc(reason.text)}${reason.count?` <strong>(${reason.count} horário(s))</strong>`:''}</p>`).join('')}<div class="audit-location"><span class="tag">${icon('user')}${esc(byId('professors',c.professorId)?.name)}</span><span class="tag">${icon('book')}${esc(hasSharedOfferings(c)?classMembershipLabel(c):classCourse(c)?.name)}${hasSharedOfferings(c)?'':` · ${c.period}º`} período</span><span class="tag">${c.weeklyDaysRequired?`${c.weeklyDaysRequired} dia(s) · ${weeklyDistribution(c).expected.join(' + ')} aulas`:'Dias não definidos'} · ${esc(shiftLabel(c))}</span></div><details class="pending-details"><summary>Ver motivos, orientações e horários possíveis</summary>${item.attempts.length?`<h4 style="margin:12px 0 5px">Motivos registrados no último autopreenchimento</h4><p>São exemplos de tentativas rejeitadas durante a busca, inclusive combinações intermediárias depois desfeitas. Não comprovam que todas as alternativas sejam inviáveis. Este histórico da execução fica disponível até a próxima alteração ou recarga da página.</p><ul>${item.attempts.map(attempt=>`<li>${esc(attempt.example)} <span>(${attempt.count} ocorrência(s) na busca)</span></li>`).join('')}</ul>`:''}<ul>${item.reasons.map(reason=>`<li><strong>${esc(reason.text)}</strong>${reason.count?` <span>Encontrado em ${reason.count} horário(s), considerando todas as salas compatíveis.</span>`:''}<p>${esc(reason.action)}</p></li>`).join('')}</ul>${item.days.length?`<div class="pending-days" aria-label="Encaixes individuais possíveis por dia">${item.days.map(day=>`<div><strong>${esc(dayName(day.day))}</strong><span>${day.available} potencial(is)</span><small>Bloco: até ${day.contiguous} adicional(is)</small><small>${day.allocated} já alocada(s)</small></div>`).join('')}</div><p>Contagem de horários, sem multiplicar pelo número de salas. Os horários potenciais são avaliados sem exigir que a primeira aula adicionada já conecte todo o bloco; a capacidade contínua considera sequências completas. Aulas adicionais podem criar novos bloqueios; os números não garantem a viabilidade de uma combinação completa.</p>`:''}${example?`<p><strong>Exemplo de encaixe individual:</strong> ${esc(dayName(example.day))} · ${example.slot} · ${timeLabel(example.slot)} · ${esc(byId('rooms',example.roomId)?.code)}. Será revalidado ao alocar.</p>`:''}${item.manualSlots>item.availableSlots?`<p>${item.manualSlots-item.availableSlots} horário(s) adicional(is) permitem tentativa manual mediante confirmação de alertas.</p>`:''}</details></div><div class="pending-actions"><button class="btn small" data-action="pending-schedule" data-id="${esc(c.id)}">Abrir na grade ${icon('arrow')}</button><button class="btn small" data-action="edit-record" data-kind="classes" data-id="${esc(c.id)}">Revisar cadastro</button></div></article>`;
      }).join('')}</div>`;
    }
    function renderAudit(){
      const all=getAudit(),errors=all.filter(a=>a.status==='ERROR'),warnings=all.filter(a=>a.status==='WARNING'),pendingCount=state.classes.filter(c=>remaining(c.id)>0).length;
      const list=all.filter(a=>ui.auditFilter==='all'||a.status===ui.auditFilter),stats=getStats(),showPending=['all','PENDING'].includes(ui.auditFilter);
      return `<section class="page" data-scroll="audit"><div class="title-line"><div><div class="eyebrow" style="margin-bottom:8px">Qualidade do planejamento</div><h2>Conflitos e pendências, com os motivos.</h2><p class="description">Validação das alocações e diagnóstico de cada disciplina que ainda tem aulas a distribuir.</p></div><div class="head-actions"><button class="btn" data-action="print">${icon('printer')}Imprimir relatório</button></div></div><div class="overview-stats"><div class="stat-card"><div class="stat-label">${icon('alert')}Conflitos ativos</div><div class="stat-value" style="color:${errors.length?'#dc2626':'#16a34a'}">${errors.length}</div><div class="stat-caption">Restrições que precisam ser resolvidas</div></div><div class="stat-card"><div class="stat-label">${icon('info')}Alocações com alertas</div><div class="stat-value" style="color:${warnings.length?'#d97706':'#64748b'}">${warnings.length}</div><div class="stat-caption">Condições que merecem revisão</div></div><div class="stat-card"><div class="stat-label">${icon('clock')}Aulas pendentes</div><div class="stat-value">${Math.max(0,stats.total-stats.fulfilled)}</div><div class="stat-caption">Em ${pendingCount} disciplina(s) · de ${stats.total} aulas previstas</div></div><div class="stat-card"><div class="stat-label">${icon('checkCircle')}Disciplinas completas</div><div class="stat-value">${state.classes.filter(c=>hasScheduledTeaching(c)&&!remaining(c.id)).length}<span style="font-size:14px;color:#94a3b8"> / ${state.classes.filter(hasScheduledTeaching).length}</span></div><div class="stat-caption">Demanda semanal de ensalamento atendida</div></div></div><div class="page-toolbar"><div class="segmented audit-segments" aria-label="Filtrar auditoria">${[['all','Todos',all.length+pendingCount],['ERROR','Conflitos',errors.length],['WARNING','Alertas',warnings.length],['PENDING','Pendentes',pendingCount]].map(([id,label,n])=>`<button class="segment ${ui.auditFilter===id?'active':''}" data-action="audit-filter" data-value="${id}">${label}<span class="count">${n}</span></button>`).join('')}</div><span class="description" style="margin:0">Uma disciplina pode ter mais de um motivo.</span></div>${list.length?`<div class="audit-list">${list.map(item=>{const a=item.allocation,c=item.class;return `<article class="audit-item ${item.status==='WARNING'?'warning':''}"><div class="audit-icon">${icon(item.status==='ERROR'?'alert':'info')}</div><div class="audit-text"><h3>${esc(c.code)} · ${esc(c.name)}</h3>${item.reasons.map(reason=>`<p>${esc(reason)}</p>`).join('')}<div class="audit-location"><span class="tag">${icon('book')}${esc(hasSharedOfferings(c)?classMembershipLabel(c):classCourse(c)?.name)}${hasSharedOfferings(c)?'':` · ${c.period}º`} · ${esc(c.turma)}</span>${a?`<span class="tag">${icon('calendar')}${dayName(a.day)} · ${a.slot} · ${timeLabel(a.slot)}</span><span class="tag">${icon('door')}${esc(byId('rooms',a.roomId)?.code)}</span>`:''}</div></div><button class="btn small" data-action="${a?'allocation-detail':'edit-record'}" data-kind="classes" data-id="${esc(a?.id||c.id)}">Revisar ${icon('arrow')}</button></article>`;}).join('')}</div>`:ui.auditFilter!=='PENDING'?`<div class="audit-ok">${icon('checkCircle')}<h3>${ui.auditFilter==='all'?'Nenhum conflito ou alerta nas alocações.':'Nenhum item neste filtro.'}</h3><p>${pendingCount?'Há disciplinas pendentes: consulte os diagnósticos no filtro Pendentes.':'Confira os demais filtros antes de finalizar o planejamento.'}</p></div>`:''}${showPending?`<div style="margin-top:${ui.auditFilter==='PENDING'?0:24}px">${renderPendingAudit()}</div>`:''}<div class="note" style="margin-top:20px">${icon('shield')}<div>Colisões de sala, docente, turma/período, indisponibilidades, distribuição diária e turnos permitidos da disciplina bloqueiam novas alocações. MISC-001 e MISC-002 geram alertas amarelos, permitem confirmação manual e permanecem na auditoria. Capacidade, tipo de sala, recursos, carga docente, excesso de aulas consecutivas e boas práticas opcionais, como MISC-005, geram alertas. Pendências são apresentadas separadamente e não aumentam o contador de conflitos ativos.</div></div></section>`;
    }
    function showModal({title,subtitle='',body='',footer='',wide=false,type='',data={}}){if(!modalRoot.childElementCount)returnFocus=document.activeElement;modalCounter++;modalState={type,...data};modalRoot.innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-subtitle"><div class="modal-head"><div><h2 id="modal-title">${esc(title)}</h2><p id="modal-subtitle">${esc(subtitle)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Fechar janela">${icon('x')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</section></div>`;app.setAttribute('inert','');requestAnimationFrame(()=>{const input=modalRoot.querySelector('input:not([type=checkbox]), select, .modal-choices button, .modal-footer button, .modal-head button');input?.focus();});}
    function closeModal(){modalCounter++;modalRoot.innerHTML='';modalState=null;app.removeAttribute('inert');returnFocus?.isConnected?returnFocus.focus():document.querySelector('.nav-tab.active')?.focus();}
    const cancelBtn='<button class="btn" data-action="close-modal">Cancelar</button>';
    function showHelp(){showModal({title:'Seu planejamento, sem complicação.',subtitle:'SADE-UFPR · Guia rápido',body:`<div class="note">${icon('info')}<div>Os dados são salvos automaticamente neste navegador. Use <strong>Exportar JSON</strong> para guardar ou compartilhar o planejamento. O primeiro acesso contém dados demonstrativos.${previousScheduleBackup?'<p style="margin-top:8px"><button class="btn small" data-action="export-previous-schedule">'+icon('download')+'Baixar backup anterior à mudança de horários</button></p>':''}</div></div><div style="font-size:12px;line-height:1.8;color:#64748b"><p><strong style="color:#003366">1. Prepare a base.</strong> Cadastre salas, cursos, docentes e turmas. Marque os horários indisponíveis no cadastro de cada docente.</p><p style="margin-top:13px"><strong style="color:#003366">2. Aloque do seu jeito.</strong> Arraste uma disciplina para a grade ou selecione o card e clique em um horário. Também é possível clicar direto em um espaço livre. Escolha blocos de 1, 2 ou 3 aulas; cada aula dura 60 minutos e o bloco permanece no mesmo turno, sem intervalos entre aulas.</p><p style="margin-top:13px"><strong style="color:#003366">3. Veja outras perspectivas.</strong> Alterne entre sala, curso/período e docente. Na visão por curso ou docente, as salas livres aparecem ordenadas por adequação. Cada turma curricular é validada separadamente. No cadastro da disciplina, selecione os turnos permitidos e informe quantos dias distintos ela deve ocupar. O sábado fica bloqueado até marcar Permitir aulas aos sábados. A divisão diária é obrigatoriamente equilibrada: 4 aulas em 2 dias ficam em 2+2; 5 em 2, em 3+2; 4 em 3, em 2+1+1. A diferença máxima entre os dias é de uma aula. A grade bloqueia uma divisão desigual, dias excedentes ou saldo insuficiente para completar a divisão.</p><p style="margin-top:13px"><strong style="color:#003366">4. Ajuste rapidamente.</strong> Arraste qualquer aula de um bloco já alocado para mover juntas todas as aulas seguidas dessa disciplina no dia. Durante o arraste, use a roda do mouse ou aproxime o ponteiro das bordas da grade para rolar até outros horários. A aula que você pegou mantém sua posição dentro do bloco; o seletor de quantidade vale para novas alocações da bandeja. Clique nela para trocar a sala. O × remove apenas aquela aula. Use Desfazer ou Ctrl+Z para recuperar uma alteração.</p><p style="margin-top:13px"><strong style="color:#003366">5. Finalize.</strong> O autopreenchimento usa uma heurística local, sem serviço externo de IA. Consulte a aba Regras MISC para as regras obrigatórias e as boas práticas de planejamento. Confira a auditoria e use Imprimir / PDF. O semestre identifica o conjunto atual; para manter semestres separados, exporte um arquivo de cada planejamento.</p></div>`,footer:'<button class="btn primary" data-action="close-modal">Entendi</button>'});}
    function editableResources(name,selected){return `<div class="checkboxes">${Object.entries(RESOURCES).map(([key,label])=>`<label class="checkbox-label"><input type="checkbox" name="${name}" value="${key}" ${selected.includes(key)?'checked':''}>${label}</label>`).join('')}</div>`;}
    function renderRestrictions(selected){let html=`<div class="restriction-grid"><span></span>${DAYS.map(d=>`<span class="rg-label">${d.short}</span>`).join('')}`;for(const s of SLOTS){html+=`<span class="rg-label">${s.id} · ${s.start}</span>`+DAYS.map(d=>{const key=`${d.id}_${s.id}`,active=selected.has(key);return `<button type="button" data-action="toggle-restriction" data-value="${key}" class="${active?'active':''}" aria-pressed="${active}" title="${d.name} · ${s.id} · ${timeLabel(s.id)}" aria-label="${d.name} ${s.id} ${active?'indisponível':'disponível'}">${active?'×':'·'}</button>`;}).join('');}return html+'</div>';}
    function openRecord(kind,id=null){
      if(!['rooms','professors','courses','classes'].includes(kind))return;
      if(kind==='classes'&&(!state.courses.length||!state.professors.length)){showModal({title:'Prepare os cadastros base',subtitle:'Uma disciplina precisa de um curso e de um docente.',body:`<div class="note">${icon('info')}<div>Cadastre ${!state.courses.length?'ao menos um curso':''}${!state.courses.length&&!state.professors.length?' e ':''}${!state.professors.length?'ao menos um docente':''} antes de adicionar disciplinas.</div></div>`,footer:'<button class="btn primary" data-action="go-register">Abrir cadastros</button>'});return;}
      const record=id?byId(kind,id):null;if(id&&!record)return;
      const x=record||({rooms:{code:'',building:'',name:'',capacity:40,type:'comum',resources:['projetor']},professors:{name:'',siape:'',department:'',email:'',maxWeeklyHours:20,unavailableSlots:[]},courses:{name:'',code:'',colorTheme:'blue'},classes:{code:'',name:'',turma:'Turma A',courseId:state.courses[0]?.id,period:1,professorId:state.professors[0]?.id,doNotAllocate:false,weeklySlotsRequired:4,weeklyDaysRequired:null,allowedShifts:null,enrolledStudents:40,requiredRoomType:'comum',requiredResources:[]}}[kind]);
      const text=(name,label,value,extra='')=>`<label class="field">${label}<input name="${name}" value="${esc(value)}" required maxlength="180" ${extra}></label>`;
      const number=(name,label,value,min,max)=>`<label class="field">${label}<input type="number" name="${name}" value="${value}" min="${min}" max="${max}" step="1" required></label>`;
      const select=(name,label,entries,value,extra='')=>`<label class="field" ${extra}>${label}<select name="${name}" required>${options(entries,value)}</select></label>`;
      let fields='';
      if(kind==='rooms')fields=`${text('code','Código da sala',x.code,'maxlength="40" placeholder="Ex.: A-101"')}${text('building','Bloco / unidade',x.building,'placeholder="Ex.: Bloco A"')}${text('name','Nome do espaço',x.name,'placeholder="Ex.: Sala 101"')}${number('capacity','Capacidade (lugares)',x.capacity,1,10000)}${select('type','Tipo de sala',Object.entries(TYPES),x.type)}<div class="field full">Recursos disponíveis${editableResources('resources',x.resources)}</div>`;
      if(kind==='professors')fields=`${text('name','Nome completo',x.name)}<label class="field">SIAPE<input name="siape" value="${esc(x.siape)}" maxlength="40"></label>${text('department','Departamento',x.department)}<label class="field">E-mail institucional<input name="email" type="email" value="${esc(x.email)}" maxlength="254" placeholder="docente@ufpr.br"></label>${number('maxWeeklyHours','Limite semanal (aulas de 60 min)',x.maxWeeklyHours,1,96)}<div class="field full" style="border-top:1px solid var(--line);padding-top:15px"><span>Indisponibilidade docente <span class="count" id="restriction-count">${x.unavailableSlots.length} horários</span></span><small>Clique para marcar ou desmarcar um horário. Células listradas bloqueiam alocações.</small><div class="restriction-wrap">${renderRestrictions(new Set(x.unavailableSlots))}</div><div><button type="button" class="btn small" data-action="clear-restrictions">Limpar restrições</button></div></div>`;
      if(kind==='courses')fields=`${text('name','Nome do curso',x.name)}${text('code','Código / sigla',x.code,'maxlength="40" placeholder="Ex.: ENG"')}${select('colorTheme','Tema visual',Object.entries(THEMES).map(([key,t])=>[key,t[3]]),x.colorTheme)}<div class="field" style="justify-content:center"><small>A cor do curso identifica suas disciplinas na bandeja e na grade.</small></div>`;
      if(kind==='classes')fields=`${teachingStructureNotice(x,false)}${joinedClassNotice(x)}${text('code','Código da disciplina',x.code,'maxlength="40" placeholder="Ex.: CI1055"')}${text('name','Nome da disciplina',x.name)}${text('turma','Identificação da turma',x.turma,'maxlength="60" placeholder="Ex.: Turma A"')}${select('courseId','Curso',state.courses.map(c=>[c.id,c.name]),x.courseId)}${number('period','Período',x.period,1,10)}${select('professorId','Docente responsável',state.professors.map(p=>[p.id,p.name]),x.professorId)}${doNotAllocateFields(x,record?classCount(record.id):0)}${number('weeklySlotsRequired','CH total semanal (aulas de 60 min)',x.weeklySlotsRequired,1,96)}${eadFields(x,record?classCount(record.id):0)}<label class="field" data-schedule-only ${!hasScheduledTeaching(x)?'hidden':''}>Dias distintos por semana<input type="number" name="weeklyDaysRequired" value="${x.weeklyDaysRequired??''}" min="1" max="6" step="1" placeholder="A definir"><small>Exatamente quantos dias diferentes a disciplina deve ocupar. Em branco: ainda não informado.</small><small data-distribution-preview>${esc(distributionHint(x))}</small></label>${shiftFields(x.allowedShifts,!hasScheduledTeaching(x))}${saturdayField(x)}${number('enrolledStudents','Alunos matriculados',x.enrolledStudents,1,10000)}${select('requiredRoomType','Tipo de sala exigido',Object.entries(TYPES),x.requiredRoomType,`data-schedule-only ${!hasScheduledTeaching(x)?'hidden':''}`)}${specificRoomField(x)}${nonConflictFields(x)}<div class="field full" data-schedule-only ${!hasScheduledTeaching(x)?'hidden':''}>Recursos necessários${editableResources('requiredResources',x.requiredResources)}</div>`;
      showModal({title:`${record?'Editar':'Adicionar'} ${registerSingular(kind)}`,subtitle:record?'As alocações existentes serão reavaliadas após salvar.':'Os campos com dados principais são obrigatórios.',body:`<form id="record-form"><div id="form-error" role="alert"></div><div class="form-grid">${fields}</div><button type="submit" class="sr-only" tabindex="-1">Salvar</button></form>`,footer:`${cancelBtn}<button class="btn primary" type="submit" form="record-form">${icon('save')}Salvar cadastro</button>`,wide:kind==='classes'||kind==='professors',type:'record',data:{kind,id,restrictions:new Set(x.unavailableSlots||[])}});
      if(kind==='classes'){refreshNonAllocationForm(document.getElementById('record-form'));protectJoinedFields(document.getElementById('record-form'),x);}
    }
    function saveRecord(form){
      const {kind,id}=modalState,fd=new FormData(form),get=n=>String(fd.get(n)||'').trim(),n=n=>Number(fd.get(n)),x={id:id||uid(kind.slice(0,3))};
      if(kind==='rooms')Object.assign(x,{code:get('code'),building:get('building'),name:get('name'),capacity:n('capacity'),type:get('type'),resources:fd.getAll('resources')});
      if(kind==='professors')Object.assign(x,{name:get('name'),siape:get('siape'),department:get('department'),email:get('email'),maxWeeklyHours:n('maxWeeklyHours'),unavailableSlots:[...modalState.restrictions]});
      if(kind==='courses')Object.assign(x,{name:get('name'),code:get('code'),colorTheme:get('colorTheme')});
      if(kind==='classes')Object.assign(x,{code:get('code'),name:get('name'),turma:get('turma'),courseId:get('courseId'),period:n('period'),professorId:get('professorId'),doNotAllocate:fd.has('doNotAllocate'),weeklySlotsRequired:n('weeklySlotsRequired'),weeklyDaysRequired:get('weeklyDaysRequired')===''?null:n('weeklyDaysRequired'),allowedShifts:fd.getAll('allowedShifts').length?fd.getAll('allowedShifts'):null,enrolledStudents:n('enrolledStudents'),requiredRoomType:get('requiredRoomType'),requiredResources:fd.getAll('requiredResources')});
      if(kind==='classes'){Object.assign(x,scheduleFormValues(form,fd));preserveJoinedMetadata(x,id?byId('classes',id):null);}
      const error=document.getElementById('form-error');let problem='';
      if(kind==='classes'&&hasScheduledTeaching(x)&&classCount(x.id)>scheduledHours(x))problem=`Já existem ${classCount(x.id)} aulas alocadas, mas a CH presencial será ${scheduledHours(x)}h. Remova as aulas excedentes antes de reduzir a demanda.`;
      const duplicate=state[kind].some(y=>y.id!==id&&(kind==='professors'?x.siape&&normalize(y.siape)===normalize(x.siape):kind==='classes'?!(x.teachingComponent&&y.teachingComponent?.familyId===x.teachingComponent.familyId)&&normalize(y.code)===normalize(x.code)&&normalize(y.turma)===normalize(x.turma)&&y.courseId===x.courseId&&y.period===x.period:normalize(y.code)===normalize(x.code)));
      if(duplicate)problem=kind==='professors'?'Já existe um docente com este SIAPE.':'Já existe um cadastro com esse código'+(kind==='classes'?', curso, período e turma.':'.');
      const next={...state,[kind]:id?state[kind].map(y=>y.id===id?x:y):[...state[kind],x]};
      if(kind==='classes'&&!hasScheduledTeaching(x))next.allocations=state.allocations.filter(a=>a.classId!==x.id);
      try{checkState(next);}catch(e){problem=e.message;}
      if(problem){error.innerHTML=`<div class="note danger">${icon('alert')}${esc(problem)}</div>`;error.scrollIntoView({block:'nearest'});return;}

      if(action==='map-day'){ui.mapDay=value;render();return;}
      if(action==='audit-filter'){ui.auditFilter=value;render();return;}
      if(action==='toggle-sidebar'){ui.sidebarOpen=!ui.sidebarOpen;document.querySelector('.sidebar')?.classList.toggle('open',ui.sidebarOpen);return;}
      if(action==='select-class'){selectClass(id);return;}
      if(action==='slot'){showSlot(target.dataset.day,target.dataset.slot);return;}
      if(action==='map-slot'){ui.selectedClass=null;showSlot(target.dataset.day,target.dataset.slot,target.dataset.room);return;}
      if(action==='choose-class'){const {day,slot,roomId}=modalState;if(roomId)attemptAllocation(id,roomId,day,slot);else showRoomPicker(id,day,slot);return;}
      if(action==='choose-room'){const {classId,day,slot,size,moveId,moveBlock}=modalState;if(moveBlock)attemptAllocationMove(moveId,id,day,slot);else attemptAllocation(classId,id,day,slot,size,moveId);return;}
      if(action==='accept-allocation'){const {classId,roomId,day,slot,size,moveId,moveBlock}=modalState;if(moveBlock)attemptAllocationMove(moveId,roomId,day,slot,true);else attemptAllocation(classId,roomId,day,slot,size,moveId,true);return;}
      if(action==='remove-allocation'){event.stopPropagation();removeAllocation(id);return;}
      if(action==='allocation-detail'){event.stopPropagation();allocationDetail(id);return;}
      if(action==='save-detail'){const a=byId('allocations',modalState.id),roomId=document.getElementById('detail-room').value;if(a.roomId===roomId){closeModal();return;}attemptAllocation(a.classId,roomId,a.day,a.slot,1,a.id);return;}
      if(action==='edit-record'){openRecord(target.dataset.kind,id);return;}
      if(action==='delete-record'){deleteRecord(target.dataset.kind,id);return;}
      if(action==='confirm-delete'){confirmDelete();return;}
      if(action==='toggle-restriction'){const set=modalState.restrictions;set.has(value)?set.delete(value):set.add(value);target.classList.toggle('active',set.has(value));target.setAttribute('aria-pressed',String(set.has(value)));target.setAttribute('aria-label',`${dayName(value.split('_')[0])} ${value.split('_')[1]} ${set.has(value)?'indisponível':'disponível'}`);target.textContent=set.has(value)?'×':'·';document.getElementById('restriction-count').textContent=`${set.size} horários`;return;}
      if(action==='clear-restrictions'){modalState.restrictions.clear();modalRoot.querySelectorAll('[data-action="toggle-restriction"]').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false');b.textContent='·';});document.getElementById('restriction-count').textContent='0 horários';return;}
      if(action==='go-register'){closeModal();ui.tab='register';ui.register=!state.courses.length?'courses':'professors';render();return;}
      if(action==='new-class'){openRecord('classes');return;}
      if(action==='new-room'){openRecord('rooms');return;}
      if(action==='go-audit'){closeModal();ui.tab='audit';ui.auditFilter=target.dataset.auditFilter||'all';render();return;}
      if(action==='pending-schedule'){const c=byId('classes',id);if(!c)return;ui.tab='schedule';ui.pivot='course';ui.courseId=c.courseId;ui.period=String(c.period);ui.selectedClass=null;render();selectClass(c.id);return;}
      if(action==='auto'){autoAllocateRemaining().catch(e=>{closeModal();toast(`Não foi possível concluir: ${e.message}`,'error');});return;}
      if(action==='undo'){undo();return;}
      if(action==='export-print-xlsx'){exportPrintingXlsx();return;}
      if(action==='export-xlsx'){exportAllocationsXlsx();return;}
      if(action==='xlsx-clear-filters'){ui.xlsxFilters={courseId:'',professorId:'',roomId:'',day:''};render();return;}
      if(action==='export'){exportJSON();return;}
      if(action==='export-previous-schedule'){
        if(!previousScheduleBackup)return;
        const url=URL.createObjectURL(new Blob([previousScheduleBackup],{type:'application/json;charset=utf-8'})),a=document.createElement('a');
        a.href=url;a.download='SADE-UFPR_backup-antes-dos-horarios-de-60min.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return;
      }
      if(action==='import'){document.getElementById('import-file').click();return;}
      if(action==='confirm-import'){const imported=modalState.imported;commit();state=imported;ui.selectedClass=null;closeModal();changed('Planejamento importado e auditado.');return;}
      if(action==='print'){ui.selectedClass=null;clearXray();window.print();return;}
      if(action==='help'){showHelp();return;}
      if(action==='reset'){showReset();return;}
      if(action==='reset-choice'){confirmResetChoice(value);return;}
      if(action==='confirm-reset'){commit();if(value==='allocations')state.allocations=[];else if(value==='demo')state=structuredClone(defaultState);else state={rooms:[],professors:[],courses:[],classes:[],allocations:[]};ui.selectedClass=null;closeModal();changed('Base reinicializada.');return;}
    });
    document.addEventListener('change',event=>{if(event.target.dataset.xlsxFilter){ui.xlsxFilters[event.target.dataset.xlsxFilter]=event.target.value;render();return;}if(event.target.closest('#teaching-parts-form')){refreshTeachingPlan();return;}if(event.target.name==='joinClassId'||event.target.id==='join-clear-allocations'){refreshJoinPreview();return;}const {id,value}=event.target;if(id==='unassigned-course'){ui.unassignedCourseId=value;render();return;}if(['doNotAllocate','eadWeeklyHours','weeklySlotsRequired'].includes(event.target.name))refreshNonAllocationForm(event.target.closest('form'));if(id==='teaching-load-sort'){ui.reportSort=value;render();}if(id==='print-course'){ui.printCourseId=value;ui.printPreview=0;render();}if(id==='print-empty-periods'){ui.printEmptyPeriods=event.target.checked;ui.printPreview=0;render();}if(id==='print-preview-select'){ui.printPreview=Number(value);render();}if(id==='room-select'){ui.roomId=value;ui.selectedClass=null;render();}if(id==='course-select'){ui.courseId=value;ui.selectedClass=null;render();}if(id==='period-select'){ui.period=value;ui.selectedClass=null;render();}if(id==='professor-select'){ui.professorId=value;ui.selectedClass=null;render();}if(id==='block-size'){ui.blockSize=Number(value);if(ui.selectedClass)applyXray(ui.selectedClass);}if(id==='semester'){ui.semester=value;persist();render();toast(`Conjunto atual identificado como ${value}. Exporte cada semestre para manter históricos separados.`);}if(id==='import-file'){importJSON(event.target.files[0]);event.target.value='';}});
    document.addEventListener('input',event=>{if(event.target.id==='non-conflict-search'){filterNonConflictOptions(event.target.value);return;}if(event.target.id==='unassigned-search'){ui.unassignedSearch=event.target.value;const start=event.target.selectionStart,end=event.target.selectionEnd;render();const input=document.getElementById('unassigned-search');input.focus();input.setSelectionRange(start,end);return;}if(event.target.closest('#teaching-parts-form')){refreshTeachingPlan();return;}if(event.target.id==='join-search'){const query=normalize(event.target.value);for(const row of document.querySelectorAll('[data-join-search]'))row.hidden=!row.dataset.joinSearch.includes(query);return;}if(event.target.closest('#record-form')&&['weeklySlotsRequired','weeklyDaysRequired','eadWeeklyHours'].includes(event.target.name))refreshNonAllocationForm(event.target.closest('form'));if(event.target.id==='demand-search')updateDemandSearch(event.target.value);if(event.target.id==='teaching-load-search'){ui.reportSearch=event.target.value;const start=event.target.selectionStart,end=event.target.selectionEnd;render();const input=document.getElementById('teaching-load-search');input.focus();input.setSelectionRange(start,end);}if(event.target.id==='register-search'){ui.registerSearch=event.target.value;const start=event.target.selectionStart,end=event.target.selectionEnd;render();const input=document.getElementById('register-search');input.focus();input.setSelectionRange(start,end);}});
    document.addEventListener('submit',event=>{if(event.target.id==='record-form'){event.preventDefault();if(event.target.reportValidity())saveRecord(event.target);}});
    document.addEventListener('keydown',event=>{
      const editing=['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName);
      if(event.key==='Escape'&&ui.drag){endDrag();return;}
      if(event.key==='Escape'){if(modalState||modalRoot.childElementCount)closeModal();else if(ui.selectedClass){ui.selectedClass=null;clearXray();document.querySelectorAll('.demand-card.selected').forEach(x=>x.classList.remove('selected'));}else if(ui.sidebarOpen){ui.sidebarOpen=false;document.querySelector('.sidebar')?.classList.remove('open');}return;}
      if(modalRoot.childElementCount&&event.key==='Tab'){const all=[...modalRoot.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex="0"]')].filter(el=>el.getClientRects().length&&!el.classList.contains('sr-only')),first=all[0],last=all.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}return;}
      if(!editing&&!modalRoot.childElementCount&&(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();undo();return;}
      if(!editing&&(event.key==='Enter'||event.key===' ')&&event.target.matches('[role="button"]')){event.preventDefault();event.target.click();}
    });
    document.addEventListener('pointerdown',mouseDragDown,true);
    document.addEventListener('pointermove',mouseDragMove,{capture:true,passive:false});
    document.addEventListener('pointerup',mouseDragUp,true);
    document.addEventListener('pointercancel',cancelMouseDrag,true);
    document.addEventListener('lostpointercapture',event=>{if(mouseDrag?.active&&event.target===mouseDrag.source)cancelMouseDrag(event);},true);
    document.addEventListener('click',guardMouseDragClick,true);
    // Mantém a rolagem nativa durante o arraste; o complemento só atua se ela não ocorreu.
    document.addEventListener('wheel',dragWheel,{capture:true,passive:true});
    document.addEventListener('scroll',dragScrollChanged,true);
    document.addEventListener('dragleave',event=>{if(ui.drag&&!event.relatedTarget&&(event.clientX<=0||event.clientY<=0||event.clientX>=innerWidth||event.clientY>=innerHeight))suspendDragScrolling();});
    window.addEventListener('blur',()=>{cancelMouseDrag();suspendDragScrolling();});
    document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelMouseDrag();suspendDragScrolling();}});
    document.addEventListener('dragstart',event=>{if(mouseDrag){event.preventDefault();return;}dragStart(event);});document.addEventListener('dragend',()=>{if(!mouseDrag?.active)endDrag();});document.addEventListener('dragenter',dragOver);document.addEventListener('dragover',dragOver);document.addEventListener('drop',dropAllocation);
    window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){toast('A base foi alterada em outra aba. Recarregue para usar a versão mais recente.','error');}});
    let auditPrintDetails=null;
    window.addEventListener('beforeprint',()=>{clearXray();prepareBatchPrint();if(auditPrintDetails===null){auditPrintDetails=[...document.querySelectorAll('.pending-details')].map(element=>({element,open:element.open}));for(const {element} of auditPrintDetails)element.open=true;}});
    window.addEventListener('afterprint',()=>{for(const {element,open} of auditPrintDetails||[])element.open=open;auditPrintDetails=null;finishBatchPrint();});
    load();render();if(loadProblem)toast(loadProblem,'error');else if(scheduleNotice)toast(scheduleNotice,storageOK?'success':'error');
  </script>
