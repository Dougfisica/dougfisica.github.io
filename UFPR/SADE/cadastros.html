 1 8 0v3',arrow:'M5 12h14m-5-5 5 5-5 5',undo:'M3 10h10a6 6 0 0 1 0 12M3 10l5-5m-5 5 5 5',save:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2ZM7 3v6h10V3M7 21v-8h10v8',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',door:'M3 21h18M6 21V3h12v18M14 12h.01',map:'m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15',external:'M15 3h6v6m0-6L10 14M9 3H3v18h18v-6',help:'M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 4h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
    const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name]||ICONS.info}"/></svg>`;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const uid=prefix=>`${prefix}_${globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)}`;
    const DAYS=[{id:'SEG',name:'Segunda-feira',short:'Segunda'},{id:'TER',name:'Terça-feira',short:'Terça'},{id:'QUA',name:'Quarta-feira',short:'Quarta'},{id:'QUI',name:'Quinta-feira',short:'Quinta'},{id:'SEX',name:'Sexta-feira',short:'Sexta'},{id:'SAB',name:'Sábado',short:'Sábado'}];
    const SLOTS=[
      {id:'M1',start:'07:30',end:'08:30'},{id:'M2',start:'08:30',end:'09:30'},
      {id:'M3',start:'09:30',end:'10:30'},{id:'M4',start:'10:30',end:'11:30'},
      {id:'M5',start:'11:30',end:'12:30'},
      {id:'T1',start:'13:30',end:'14:30'},{id:'T2',start:'14:30',end:'15:30'},
      {id:'T3',start:'15:30',end:'16:30'},{id:'T4',start:'16:30',end:'17:30'},
      {id:'T5',start:'17:30',end:'18:30'},
      {id:'N1',start:'19:00',end:'20:00'},{id:'N2',start:'20:00',end:'21:00'},
      {id:'N3',start:'21:00',end:'22:00'},{id:'N4',start:'22:00',end:'23:00'}

    const SHIFT_LABELS={M:'Manhã',T:'Tarde',N:'Noite'};
    const TYPES={comum:'Sala comum',lab_info:'Lab. Informática',lab_quimica:'Lab. Química',lab_fisica:'Lab. Física',auditorio:'Auditório',desenho:'Sala de desenho'};
    const RESOURCES={projetor:'Projetor',ar:'Ar-condicionado',lousa_digital:'Lousa digital',acessibilidade:'Acessibilidade'};
    const THEMES={blue:['#2563eb','#dbeafe','#1e3a8a','Engenharias e Exatas'],purple:['#9333ea','#f3e8ff','#581c87','Computação'],amber:['#d97706','#fef3c7','#78350f','Humanas'],emerald:['#16a34a','#dcfce7','#14532d','Biológicas'],rose:['#e11d48','#ffe4e6','#881337','Outros cursos']};
    function teachingPartLabel(c){const p=c?.teachingComponent;if(!p)return '';if(p.kind==='theory')return 'Teoria · turma inteira';const label=c.requiredRoomType.startsWith('lab_')?'Prática':'Outra sala';return p.groupSizes.length===1?label+' · turma inteira':`${label} · grupo ${p.groupIndex}/${p.groupSizes.length}`;}
    function hasSharedOfferings(c){return classOfferings(c).length>1;}
    function teachingFamilyClasses(c,s=state){return c?.teachingComponent?s.classes.filter(x=>x.teachingComponent?.familyId===c.teachingComponent.familyId):c?[c]:[];}
    function normalizeTeachingComponent(meta,c,data){
      if(!meta||typeof meta!=='object'||Array.isArray(meta))throw Error('Configuração de teoria/prática inválida.');
      const original=meta.sourceClass;
      if(!original||typeof original!=='object'||original.teachingComponent!==undefined||original.joinedClasses?.some(x=>x?.teachingComponent!==undefined))throw Error('A origem de teoria/prática deve ser uma disciplina sem outras divisões.');
      const source=checkState({rooms:data.rooms,professors:data.professors,courses:data.courses,classes:[original],allocations:[]},{skipNonConflictReferences:true}).classes[0];
      if(source.doNotAllocate||meta.familyId!==source.id)throw Error('Origem inválida para uma disciplina dividida em teoria/prática.');
      if(!['theory','practice'].includes(meta.kind)||!Number.isInteger(meta.theorySlots)||meta.theorySlots<1||!Number.isInteger(meta.practiceSlots)||meta.practiceSlots<1||meta.theorySlots+meta.practiceSlots!==scheduledHours(source))throw Error('A CH de teoria presencial mais prática deve corresponder à CH presencial original; a EaD é contada uma vez.');
      if(!Array.isArray(meta.groupSizes)||!meta.groupSizes.length||meta.groupSizes.length>20||meta.groupSizes.some(n=>!Number.isInteger(n)||n<1)||meta.groupSizes.reduce((a,b)=>a+b,0)!==source.enrolledStudents)throw Error('Os grupos práticos devem reunir exatamente todos os alunos da disciplina.');
      if(!Number.isInteger(meta.groupIndex)||(meta.kind==='theory'?meta.groupIndex!==0:meta.groupIndex<1||meta.groupIndex>meta.groupSizes.length))throw Error('Identificação de grupo prático inválida.');
      const hours=meta.kind==='theory'?meta.theorySlots+eadHours(source):meta.practiceSlots,students=meta.kind==='theory'?source.enrolledStudents:meta.groupSizes[meta.groupIndex-1];
      if(eadHours(c)!==(meta.kind==='theory'?eadHours(source):0)||c.weeklySlotsRequired!==hours||c.enrolledStudents!==students||c.doNotAllocate||c.joinedClasses||c.courseId!==source.courseId||c.period!==source.period||c.turma!==source.turma)throw Error('CH, alunos e vínculos das partes devem corresponder à divisão. Use Reunir teoria/prática para reconfigurar.');
      if(meta.kind==='theory'?(c.id!==source.id||c.requiredRoomType!=='comum'):!Object.hasOwn(TYPES,c.requiredRoomType))throw Error('A primeira parte exige sala comum; a segunda parte precisa de um tipo de espaço válido.');
      return {familyId:source.id,kind:meta.kind,groupIndex:meta.groupIndex,theorySlots:meta.theorySlots,practiceSlots:meta.practiceSlots,groupSizes:[...meta.groupSizes],sourceClass:source};
    }
    function validateTeachingFamilies(s){
      const families=new Map(),owners=new Map();
      for(const c of s.classes){const p=c.teachingComponent;if(!p)continue;if(!families.has(p.familyId))families.set(p.familyId,[]);families.get(p.familyId).push(c);}
      for(const [id,parts] of families){
        const first=parts[0].teachingComponent,signature=p=>JSON.stringify([p.sourceClass,p.theorySlots,p.practiceSlots,p.groupSizes]);
        if(parts.length!==first.groupSizes.length+1||new Set(parts.map(c=>c.teachingComponent.groupIndex)).size!==parts.length||parts.some(c=>signature(c.teachingComponent)!==signature(first))||!parts.some(c=>c.teachingComponent.kind==='theory'))throw Error('Divisão teoria/prática incompleta ou inconsistente. Importe todas as partes da disciplina.');
        for(const member of first.sourceClass.joinedClasses||[first.sourceClass]){
          if(owners.has(member.id)&&owners.get(member.id)!==id)throw Error('Uma oferta original pertence a duas divisões de teoria/prática.');owners.set(member.id,id);
          if(s.classes.some(c=>c.id===member.id&&c.teachingComponent?.familyId!==id||c.joinedClasses?.some(m=>m.id===member.id)))throw Error('Uma oferta de teoria/prática também aparece como disciplina independente.');
        }
      }
    }
    function planTeachingParts(id,{theorySlots,practiceSlots,groupCount=2,theoryDays=1,practiceDays=1,labType='lab_info',secondaryRoomType=null,theoryRoomId=undefined,practiceRoomId=undefined,clearAllocations=false}={},s=state){
      const source=s.classes.find(c=>c.id===id);if(!source)throw Error('Disciplina não encontrada.');
      if(source.teachingComponent)throw Error('Reúna teoria/prática antes de alterar a divisão.');
      if(source.doNotAllocate)throw Error('Desmarque Não alocar para dividir a disciplina em aulas de teoria e prática.');
      if(!Number.isInteger(theorySlots)||!Number.isInteger(practiceSlots)||theorySlots<1||practiceSlots<1||theorySlots+practiceSlots!==scheduledHours(source))throw Error(`Teoria presencial + prática por aluno devem somar ${scheduledHours(source)} h/semana, com ao menos 1h de cada parte.`);
      if(!Number.isInteger(groupCount)||groupCount<1||groupCount>Math.min(20,source.enrolledStudents))throw Error('Informe de 1 a 20 grupos, com pelo menos um aluno em cada grupo.');
      if(![theoryDays,practiceDays].every(Number.isInteger)||theoryDays<1||practiceDays<1||theoryDays>Math.min(6,theorySlots)||practiceDays>Math.min(6,practiceSlots))throw Error('Os dias de cada parte devem caber na respectiva CH (até 6 dias).');
      if(source.weeklyDaysRequired&&(source.weeklyDaysRequired>theoryDays+practiceDays||source.weeklyDaysRequired<Math.max(theoryDays,practiceDays)))throw Error(`Os dias de teoria e prática não permitem cumprir os ${source.weeklyDaysRequired} dias originais por aluno. Ajuste os dias de cada parte.`);
      const roomType=secondaryRoomType??labType;
      if(!Object.hasOwn(TYPES,roomType)||secondaryRoomType===null&&!roomType.startsWith('lab_'))throw Error('Selecione um tipo de espaço válido para a segunda parte.');
      const old=s.allocations.filter(a=>a.classId===id);
      if(old.length&&!clearAllocations)throw Error(`A disciplina tem ${old.length} aula(s) alocada(s). Marque a opção de limpar somente esses horários para confirmar a divisão.`);
      const pinned=source.requiredRoomId?s.rooms.find(r=>r.id===source.requiredRoomId):null;
      if(pinned&&theoryRoomId===undefined&&practiceRoomId===undefined&&!['comum',roomType].includes(pinned.type))throw Error('A sala específica original não corresponde aos tipos escolhidos. Altere a sala específica antes de dividir.');
      function resolveRoom(value,type,label){if(value==null||value==='')return null;const room=s.rooms.find(r=>r.id===value);if(!room)throw Error(`Sala da ${label} não encontrada.`);if(room.type!==type)throw Error(`A sala da ${label} deve ser do tipo ${TYPES[type]}.`);return room;}
      const firstRoom=resolveRoom(theoryRoomId===undefined?(pinned?.type==='comum'?pinned.id:null):theoryRoomId,'comum','primeira parte');
      const secondRoom=resolveRoom(practiceRoomId===undefined?(pinned?.type===roomType?pinned.id:null):practiceRoomId,roomType,'segunda parte');
      const groupSizes=Array.from({length:groupCount},(_,i)=>Math.floor(source.enrolledStudents/groupCount)+(i<source.enrolledStudents%groupCount?1:0));
      const parts=Array.from({length:groupCount+1},(_,i)=>{
        const c=structuredClone(source);delete c.joinedClasses;
        const suffix=i?(groupCount===1?(roomType.startsWith('lab_')?' · Prática':' · Outra sala'):` · ${roomType.startsWith('lab_')?'Prática':'Outra sala'} G${i}/${groupCount}`):' · Teoria';
        Object.assign(c,{id:i?uid('pratica'):source.id,name:source.name.slice(0,180-suffix.length)+suffix,weeklySlotsRequired:i?practiceSlots:theorySlots+eadHours(source),weeklyDaysRequired:i?practiceDays:theoryDays,enrolledStudents:i?groupSizes[i-1]:source.enrolledStudents,requiredRoomType:i?roomType:'comum',teachingComponent:{familyId:source.id,kind:i?'practice':'theory',groupIndex:i,theorySlots,practiceSlots,groupSizes:[...groupSizes],sourceClass:structuredClone(source)}});
        if(i)delete c.eadWeeklyHours;
        const room=i?secondRoom:firstRoom;if(room)c.requiredRoomId=room.id;else delete c.requiredRoomId;
        return c;
      });
      const next=checkState({...s,classes:s.classes.flatMap(c=>c.id===id?parts:[c]),allocations:s.allocations.filter(a=>a.classId!==id)});
      const warnings=[];for(const part of parts){const room=s.rooms.find(r=>r.id===part.requiredRoomId);if(room&&room.capacity<part.enrolledStudents)warnings.push(`${room.code}: ${room.capacity} lugares para ${part.enrolledStudents} alunos de ${part.name}.`);if(room&&part.requiredResources.some(resource=>!room.resources.includes(resource)))warnings.push(`${room.code}: faltam recursos exigidos na parte ${part.name}.`);}
      return {next,parts:next.classes.filter(c=>c.teachingComponent?.familyId===id),source:structuredClone(source),groupSizes,studentHours:source.weeklySlotsRequired,teachingHours:theorySlots+practiceSlots*groupCount+eadHours(source),eadHours:eadHours(source),removedAllocations:old.length,warnings:[...new Set(warnings)]};
    }
    function planRestoreTeachingParts(id,s=state){
      const c=s.classes.find(x=>x.id===id);if(!c?.teachingComponent)throw Error('Esta disciplina não está dividida em teoria/prática.');
      const parts=teachingFamilyClasses(c,s),ids=new Set(parts.map(x=>x.id)),source=structuredClone(c.teachingComponent.sourceClass);
      return {next:checkState(pruneNonConflictReferences({...s,classes:s.classes.flatMap(x=>x.id===source.id?[source]:ids.has(x.id)?[]:[x]),allocations:s.allocations.filter(a=>!ids.has(a.classId))})),source,parts,removedAllocations:s.allocations.filter(a=>ids.has(a.classId)).length};
    }
    function teachingStudentSchedules(c,allocations,proposed=null,s=state){
      const meta=c?.teachingComponent;if(!meta)return [];
      const parts=new Map(teachingFamilyClasses(c,s).map(x=>[x.id,x.teachingComponent]));
      const own=allocations.filter(a=>parts.has(a.classId));if(proposed)own.push(proposed);
      return meta.groupSizes.map((students,i)=>{
        const id=`student_${meta.familyId}_${i+1}`,source={...meta.sourceClass,id,doNotAllocate:false};
        const selected=own.filter(a=>{const p=parts.get(a.classId);return p&&(p.kind==='theory'||p.groupIndex===i+1);}).map(a=>({...a,classId:id}));
        return {group:i+1,students,source,allocations:selected};
      });
    }
    function teachingFamilyIssues(c,allocations,proposed=null,s=state,{skipContinuity=false}={}){
      const errors=[],warnings=[];
      if(c?.teachingComponent){const source=c.teachingComponent.sourceClass,theory=teachingFamilyClasses(c,s).find(part=>part.teachingComponent.kind==='theory');if(source.weeklyDaysRequired&&theory?.weeklyDaysRequired)for(const part of teachingFamilyClasses(c,s).filter(part=>part.teachingComponent.kind==='practice'&&part.weeklyDaysRequired)){if(source.weeklyDaysRequired>theory.weeklyDaysRequired+part.weeklyDaysRequired||source.weeklyDaysRequired<Math.max(theory.weeklyDaysRequired,part.weeklyDaysRequired))errors.push(`[MISC-004] Teoria/prática · grupo ${part.teachingComponent.groupIndex}: os dias das partes não permitem cumprir os ${source.weeklyDaysRequired} dias originais por aluno.`);}}
      for(const student of teachingStudentSchedules(c,allocations,proposed,s)){
        const prefix=`Teoria/prática · grupo ${student.group}: `;
        for(const reason of classDayIssues(student.source,student.allocations))errors.push(`[MISC-004] ${prefix}${reason}`);
        if(!skipContinuity)for(const reason of weeklyContinuityInfo(student.source,student.allocations).reasons)errors.push(`[MISC-006] ${prefix}${reason}`);
        const spacing=weeklySpacingInfo(student.source,student.allocations);if(spacing.penalty)warnings.push(`[MISC-005] ${prefix}Boa prática: deixe ao menos um dia livre entre os encontros de teoria e prática. Dias consecutivos são permitidos com alerta.`);
      }
      return {errors:[...new Set(errors)],warnings:[...new Set(warnings)]};
    }
    function teachingRemovalSplits(c,allocations,next,day,s=state){
      const before=teachingStudentSchedules(c,allocations,null,s),after=teachingStudentSchedules(c,next,null,s);
      return after.some((student,i)=>(weeklyContinuityInfo(student.source,student.allocations).days.find(d=>d.day===day)?.runs.length||0)>(weeklyContinuityInfo(before[i].source,before[i].allocations).days.find(d=>d.day===day)?.runs.length||0));
    }
    function teachingStructureNotice(c,saved=false){
      if(c?.teachingComponent){const p=c.teachingComponent;return `<div class="field full joined-notice teaching-notice"><strong>${esc(teachingPartLabel(c))} · ${c.enrolledStudents} alunos · ${c.weeklySlotsRequired} h/semana</strong><p>${p.sourceClass.weeklySlotsRequired} h por aluno = ${p.theorySlots} h teóricas presenciais + ${p.practiceSlots} h práticas${eadHours(p.sourceClass)?` + ${eadHours(p.sourceClass)}h EaD`: ''}. Grupos: ${p.groupSizes.join(' + ')} alunos. CH docente total da divisão: ${p.theorySlots+p.practiceSlots*p.groupSizes.length+eadHours(p.sourceClass)} h, se o mesmo docente atender todas as partes.</p><small>Os dias de cada parte são editáveis. A disciplina original exige ${p.sourceClass.weeklyDaysRequired||'dias a definir'} dia(s) por aluno, considerando teoria + seu grupo prático, com divisão equilibrada e continuidade no mesmo dia. Para mudar CH, alunos ou vínculos, reúna a disciplina e configure novamente. Docente, turnos e recursos podem ser ajustados por parte.</small><div style="margin-top:10px">${saved?teachingStructureButton(c):'<small>Salve ou feche a edição e use Reunir teoria/prática na lista de disciplinas.</small>'}</div></div>`;}
      return `<div class="field full joined-notice teaching-notice"><strong>Parte da CH em sala comum e parte em outra sala</strong><p>Ex.: 2h em sala comum + 2h em laboratório, com a turma inteira. A divisão da segunda parte em grupos é opcional.</p>${saved?teachingStructureButton(c):'<small>Salve o cadastro e use Distribuir CH entre salas para escolher a carga e o espaço de cada parte.</small>'}</div>`;
    }
    function teachingStructureButton(c){return c.teachingComponent?`<button type="button" class="btn small" data-action="restore-teaching" data-id="${esc(c.id)}">Reunir teoria/prática</button>`:hasScheduledTeaching(c)&&scheduledHours(c)>=2?`<button type="button" class="btn small" data-action="split-teaching" data-id="${esc(c.id)}">Distribuir CH entre salas</button>`:'';}
    function protectTeachingFields(form,c){
      if(!c?.teachingComponent||!form?.querySelector)return;
      const names=['code','name','turma','courseId','period','weeklySlotsRequired','enrolledStudents','doNotAllocate','eadWeeklyHours'];if(c.teachingComponent.kind==='theory')names.push('requiredRoomType');

      const excludedIds=new Set(),timeBuckets=new Map();for(const a of state.allocations){const key=a.day+'_'+a.slot,bucket=timeBuckets.get(key)||[];for(const b of bucket)if(a.classId!==b.classId&&explicitClassConflict(byId('classes',a.classId),byId('classes',b.classId))){excludedIds.add(a.classId);excludedIds.add(b.classId);}bucket.push(a);timeBuckets.set(key,bucket);}const explicitCollisions=scheduled.filter(c=>excludedIds.has(c.id));
      if(explicitCollisions.length)issues.push({title:`${explicitCollisions.length} oferta(s) violam a regra Não conflitar`,text:explicitCollisions.map(c=>c.code).join(' · ')+'. Os horários foram preservados; reorganize-os no index.html ou revise as restrições.',step:'classes'});
      const wrongFixed=scheduled.filter(c=>c.requiredRoomId&&state.allocations.some(a=>a.classId===c.id&&a.roomId!==c.requiredRoomId));
      if(wrongFixed.length)issues.push({title:`${wrongFixed.length} disciplina(s) com horários fora da sala específica`,text:wrongFixed.map(c=>c.code+' · '+specificRoomLabel(c)).join(' · ')+'. Corrija os horários no index.html ou altere a sala específica.',step:'classes'});
      const unmatched=scheduled.filter(c=>!state.rooms.some(r=>(!c.requiredRoomId||r.id===c.requiredRoomId)&&r.capacity>=c.enrolledStudents&&r.type===c.requiredRoomType&&c.requiredResources.every(resource=>r.resources.includes(resource))));
      if(unmatched.length)issues.push({title:`${unmatched.length} disciplina(s) sem sala totalmente compatível`,text:unmatched.slice(0,6).map(c=>`${c.code} (${c.enrolledStudents} alunos, ${TYPES[c.requiredRoomType]}${c.requiredRoomId?', '+specificRoomLabel(c):''})`).join(' · ')+(unmatched.length>6?' · Consulte as demais disciplinas na etapa 4.':''),step:'rooms'});
      const overloaded=state.professors.map(p=>({p,demand:state.classes.filter(c=>c.professorId===p.id).reduce((n,c)=>n+c.weeklySlotsRequired,0),scheduleDemand:scheduled.filter(c=>c.professorId===p.id).reduce((n,c)=>n+scheduledHours(c),0)})).filter(({p,demand,scheduleDemand})=>demand>p.maxWeeklyHours||scheduleDemand>DAYS.length*SLOTS.length-p.unavailableSlots.length);
      if(overloaded.length)issues.push({title:`${overloaded.length} docente(s) com demanda acima do limite ou da disponibilidade`,text:overloaded.slice(0,6).map(({p,demand,scheduleDemand})=>`${p.name}: ${demand} h totais, ${scheduleDemand} aulas para ensalamento, limite ${p.maxWeeklyHours}, ${DAYS.length*SLOTS.length-p.unavailableSlots.length} horários livres`).join(' · '),step:'professors'});
      const exemptWithAllocations=state.classes.filter(c=>!hasScheduledTeaching(c)&&state.allocations.some(a=>a.classId===c.id));
      if(exemptWithAllocations.length)issues.push({title:`${exemptWithAllocations.length} disciplina(s) sem demanda presencial (Não alocar / 100% EaD) com horários existentes`,text:'Edite e salve essas disciplinas para remover suas aulas da grade, ou ajuste as alocações no index.html.',step:'classes'});
      const groups=new Map();for(const c of scheduled){const audiences=new Map(classOfferings(c).map(member=>[JSON.stringify([member.courseId,member.period,normalize(member.turma)]),member]));for(const [key,member] of audiences){const group=groups.get(key)||{courseId:member.courseId,period:member.period,turma:member.turma,demand:0};group.demand+=scheduledHours(c);groups.set(key,group);}}const fullGroups=[...groups.values()].filter(g=>g.demand>DAYS.length*SLOTS.length);
      if(fullGroups.length)issues.push({title:`${fullGroups.length} turma(s) com carga maior que a semana disponível`,text:fullGroups.slice(0,6).map(g=>`${byId('courses',g.courseId)?.name} · ${g.period}º · ${g.turma}: ${g.demand} aulas`).join(' · '),step:'classes'});
      let duplicates=0;for(const kind of ['rooms','courses','classes','professors']){const seen=new Set();for(const x of state[kind]){const key=kind==='professors'?normalize(x.siape):kind==='classes'?JSON.stringify([normalize(x.code),x.courseId,x.period,normalize(x.turma)]):normalize(x.code);if(!key)continue;if(seen.has(key))duplicates++;else seen.add(key);}}
      if(duplicates)issues.push({title:`${duplicates} identificação(ões) repetida(s) na base importada`,text:'Revise códigos de salas, cursos, disciplinas e matrículas SIAPE para evitar cadastros duplicados.',step:'rooms'});
      return {missing,issues,ready:!missing.length&&!issues.length};
    }
    function exportPayload(){return checkState({...state,allocations:ui.keepAllocations?state.allocations:[]});}
    function fileName(){return `SADE-UFPR_cadastros_${ui.semester}.json`;}
    function renderReview(){const check=readiness(),demand=state.classes.reduce((n,c)=>n+c.weeklySlotsRequired,0),drafts=pendingDrafts();return `<div class="review-body" data-scroll="review"><div class="summary-grid">${[['rooms','door','Salas','lugares disponíveis'],['professors','user','Docentes','pessoas cadastradas'],['courses','book','Cursos','cursos identificados'],['classes','layers','Disciplinas','aulas semanais']].map(([kind,ic,label,caption])=>`<div class="summary"><p>${icon(ic)}${label}</p><strong>${state[kind].length}</strong><small>${kind==='rooms'?state.rooms.reduce((n,r)=>n+r.capacity,0):kind==='classes'?demand:state[kind].length} ${caption}</small></div>`).join('')}</div>${drafts?`<div class="note warning">${icon('edit')}<div>Há <strong>${drafts} rascunho(s)</strong> ainda não salvo(s) como cadastro. O JSON inclui apenas os registros salvos. Volte à etapa correspondente e clique em salvar para incluí-los.</div></div>`:''}<div class="review-columns"><section class="panel review-section"><header class="panel-head"><h2>${icon('shield')}Revisão da base</h2><span class="tag ${check.ready?'good':'warning'}">${icon(check.ready?'checkCircle':'info')}${check.ready?'Pronta para alocar':'Revisar itens'}</span></header><div class="checklist"><div class="check-item">${icon('checkCircle')}<div><strong>Formato compatível com o SADE</strong><p>Salas, docentes, cursos, disciplinas e alocações com identificadores e vínculos validados. Grade de ${SLOTS.length} horários diários, com aulas de 60 minutos.</p></div></div>${STEPS.slice(0,4).map(step=>{const count=state[step.key].length;return `<div class="check-item ${count?'':'warning'}">${icon(count?'checkCircle':'info')}<div><strong>${step.name}: ${count} registro(s)</strong><p>${count?'Etapa preenchida. Você pode continuar editando quando precisar.':'Esta etapa está vazia. O arquivo pode ser exportado como base parcial.'}</p></div><button class="btn small" data-action="step" data-value="${step.key}">${count?'Revisar':'Preencher'}${icon('arrow')}</button></div>`;}).join('')}${check.issues.map(issue=>`<div class="check-item warning">${icon('alert')}<div><strong>${esc(issue.title)}</strong><p>${esc(issue.text)}</p></div><button class="btn small" data-action="step" data-value="${issue.step}">Revisar${icon('arrow')}</button></div>`).join('')}${check.ready?`<div class="check-item">${icon('checkCircle')}<div><strong>Condições básicas de ensalamento atendidas</strong><p>Cada disciplina que requer ensalamento possui uma opção de sala compatível. Componentes marcados como Não alocar dispensam sala e horário. A disponibilidade simultânea, os conflitos de horários e a quantidade exata de dias serão verificados no index.html.</p></div></div>`:''}</div></section><div><section class="panel export-panel"><header class="panel-head"><h2>${icon('download')}Arquivo para o ensalamento</h2></header><div class="export-content"><label class="field"><span>Semestre de referência</span><select id="semester">${options([...new Set(['2026.1','2026.2','2027.1','2027.2','2028.1','2028.2',ui.semester])].sort().map(s=>[s,s]),ui.semester)}</select><small>O semestre identifica o nome do arquivo. Selecione o mesmo semestre no sistema de alocação.</small></label>${state.allocations.length?`<label class="checkbox-label" style="margin-top:17px;align-items:flex-start;line-height:1.7"><input id="keep-allocations" type="checkbox" style="margin-top:3px" ${ui.keepAllocations?'checked':''}>Preservar as ${state.allocations.length} aulas alocadas no JSON importado.</label>`:'<p class="description" style="font-size:10px;margin-top:15px">Esta base começa com a grade vazia. Somente disciplinas sem a opção Não alocar aparecerão como demandas de ensalamento.</p>'}<button class="btn primary download-button" data-action="download-json">${icon('download')}Baixar arquivo JSON</button><p class="file-name" id="file-name">${fileName()}</p><div class="export-steps"><div><span>1</span><p>Baixe o arquivo com os cadastros salvos.</p></div><div><span>2</span><p>Abra <a href="index.html" class="subtle-link">index.html</a> e clique em <strong>Importar JSON</strong> no topo.</p></div><div><span>3</span><p>Selecione o arquivo, confira os dados e confirme a importação.</p></div></div><div class="note warning" style="margin:0">${icon('info')}<div>A importação no index.html substitui a base atual. Para editar um planejamento existente, importe seu JSON aqui e preserve as aulas já alocadas.</div></div></div></section><details class="code-preview" id="json-preview"><summary>Conferir o conteúdo do JSON</summary><pre id="preview-code" tabindex="0" aria-label="Prévia do arquivo JSON"></pre></details><p class="description" style="font-size:9px;margin-top:13px">O arquivo contém apenas os dados cadastrados. Rascunhos e preferências desta página ficam no navegador.</p></div></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px"><a class="btn" href="index.html">${icon('calendar')}Abrir sistema de alocação${icon('external')}</a><button class="btn ghost small" data-action="reset">${icon('reset')}Limpar esta base</button></div></div>`;}
    function showModal({title,subtitle='',body='',footer='',wide=false,type='',data={}}){if(!modalRoot.childElementCount)returnFocus=document.activeElement;modal={type,...data};modalRoot.innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-subtitle"><header class="modal-head"><div><h2 id="modal-title">${esc(title)}</h2><p id="modal-subtitle">${esc(subtitle)}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Fechar">${icon('x')}</button></header><div class="modal-body">${body}</div><footer class="modal-foot">${footer}</footer></section></div>`;app.setAttribute('inert','');requestAnimationFrame(()=>modalRoot.querySelector('.modal-foot button')?.focus());}
    function closeModal(){modalRoot.innerHTML='';modal=null;app.removeAttribute('inert');if(returnFocus?.isConnected)returnFocus.focus();else document.querySelector('.step.active')?.focus();}
    const cancelButton=()=>'<button class="btn" data-action="close-modal">Cancelar</button>';
    function deleteRecord(id){const kind=ui.step,record=byId(kind,id);if(!record)return;if(kind==='rooms'&&showFixedRoomDeletion(id))return;if(joinedReferenceBlocksDeletion(kind,id)){showModal({title:'Reúna teoria/prática ou separe as turmas antes de excluir',body:'<p>Este cadastro participa de ofertas originais preservadas. Use Reunir teoria/prática e, se houver uma junção, Separar turmas antes da exclusão.</p>',footer:cancelButton()});return;}const classIds=new Set(kind==='classes'?teachingFamilyClasses(record).map(c=>c.id):kind==='courses'?state.classes.filter(c=>c.courseId===id).map(c=>c.id):kind==='professors'?state.classes.filter(c=>c.professorId===id).map(c=>c.id):[]),allocationIds=new Set(state.allocations.filter(a=>kind==='rooms'?a.roomId===id:classIds.has(a.classId)).map(a=>a.id));showModal({title:`Excluir ${LABELS[kind]}?`,subtitle:record.name,body:`${classIds.size>1?`<div class="note warning">${icon('alert')}<div>Este cadastro tem <strong>${classIds.size} disciplina(s)</strong> vinculada(s), que também serão excluídas.</div></div>`:''}${allocationIds.size?`<div class="note warning">${icon('calendar')}<div>Serão removidas <strong>${allocationIds.size} alocação(ões)</strong> do planejamento importado.</div></div>`:''}<p>Restrições que apontem para ofertas excluídas também serão removidas. A exclusão pode ser desfeita nesta sessão. Os demais cadastros serão mantidos.</p>`,footer:`${cancelButton()}<button class="btn danger" data-action="confirm-delete">${icon('trash')}Excluir cadastro</button>`,type:'delete',data:{kind,id,classIds,allocationIds}});}
    function confirmDelete(){const {kind,id,classIds,allocationIds}=modal,next=structuredClone(state);next[kind]=next[kind].filter(x=>kind==='classes'?!classIds.has(x.id):x.id!==id);if(kind!=='classes'&&classIds.size)next.classes=next.classes.filter(c=>!classIds.has(c.id));next.allocations=next.allocations.filter(a=>!allocationIds.has(a.id));if(ui.drafts[kind]?.id===id)delete ui.drafts[kind];if(classIds.has(ui.drafts.classes?.id))delete ui.drafts.classes;if(kind!=='classes')for(const classId of classIds)if(ui.drafts.classes?.id===classId)delete ui.drafts.classes;closeModal();mutate(pruneNonConflictReferences(next),'Cadastro excluído.');}
    function downloadJSON(skipDraftWarning=false){if(pendingDrafts()&&!skipDraftWarning){showModal({title:'Alguns rascunhos ainda não foram salvos',subtitle:'O JSON inclui apenas cadastros salvos.',body:`<div class="note warning">${icon('edit')}<div>Você tem ${pendingDrafts()} rascunho(s). Para incluí-los no arquivo, volte à etapa correspondente e clique em salvar.</div></div><p>Também é possível baixar agora apenas os registros já salvos.</p>`,footer:`${cancelButton()}<button class="btn primary" data-action="download-saved">Baixar registros salvos</button>`});return;}
      try{const payload=exportPayload(),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=fileName();link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`JSON gerado com ${totalRecords()} registro(s) e ${payload.allocations.length} alocação(ões).`);}catch(e){toast(`Não foi possível gerar o arquivo: ${e.message}`,'error');}
    }
    async function importJSON(file){if(!file)return;if(file.size>10*1024*1024){toast('O arquivo deve ter no máximo 10 MB.','error');return;}try{const prepared=prepareScheduleState(JSON.parse(await file.text())),imported=prepared.state;showModal({title:'Carregar estes cadastros?',subtitle:file.name,body:`<div class="note">${icon('upload')}<div>${imported.rooms.length} salas · ${imported.professors.length} docentes · ${imported.courses.length} cursos · ${imported.classes.length} disciplinas.<br>${imported.allocations.length} aulas já alocadas serão preservadas na base.</div></div>${prepared.removedAllocations||prepared.removedRestrictions?`<div class="note warning">${icon('clock')}<div>Adaptação à grade de 60 minutos: ${prepared.removedAllocations} aula(s) em M6 ou T6 voltarão ao saldo. ${prepared.removedRestrictions} restrição(ões) de horários extintos serão removidas.</div></div>`:''}<p>Os cadastros e rascunhos atuais desta página serão substituídos. O planejamento salvo no index.html permanece separado.</p>`,footer:`${cancelButton()}<button class="btn primary" data-action="confirm-import">${icon('upload')}Carregar cadastros</button>`,type:'import',data:{imported}});}catch(e){showModal({title:'Este arquivo não pôde ser carregado',subtitle:'A base atual foi preservada.',body:`<div class="note danger">${icon('alert')}<div>${esc(e.message)}</div></div><p>Use um JSON exportado por esta página ou pelo index.html, com rooms, professors, courses, classes e allocations.</p>`,footer:'<button class="btn primary" data-action="close-modal">Entendi</button>'});}}
    function reset(){showModal({title:'Limpar esta base de cadastros?',subtitle:'Salas, docentes, cursos, disciplinas e rascunhos desta página serão removidos.',body:'<div class="note warning">'+icon('info')+'Gere um JSON antes se quiser guardar uma cópia. Esta ação não altera o planejamento salvo no index.html.</div>',footer:`${cancelButton()}<button class="btn danger" data-action="confirm-reset">Limpar base</button>`,type:'reset'});}
    document.addEventListener('click',event=>{
      const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,value=target.dataset.value,id=target.dataset.id;
      if(action==='class-staffing-filter'){ui.onlyUnassigned=value==='unassigned';render();return;}
      if(action==='step'){changeStep(value);return;}
      if(action==='backdrop'){if(event.target===target)closeModal();return;}
      if(action==='split-teaching'){openTeachingSplit(id);return;}
      if(action==='confirm-teaching-split'){confirmTeachingSplit();return;}
      if(action==='restore-teaching'){openTeachingRestore(id);return;}
      if(action==='confirm-teaching-restore'){confirmTeachingRestore(id);return;}
      if(action==='join-classes'){openJoinClasses();return;}
      if(action==='confirm-join'){confirmJoinClasses();return;}
      if(action==='separate-classes'){openSeparateClasses(id);return;}
      if(action==='confirm-separate'){confirmSeparateClasses();return;}
      if(action==='close-modal'){closeModal();return;}
      if(action==='undo'){undo();return;}
      if(action==='new-record'){replaceDraft('new');return;}
      if(action==='edit-record'){replaceDraft('edit',{id});return;}
      if(action==='confirm-replace-draft'){const {nextAction,id}=modal;closeModal();applyDraftAction(nextAction,{id});return;}
      if(action==='delete-record'){deleteRecord(id);return;}
      if(action==='confirm-delete'){confirmDelete();return;}
      if(action==='restriction-slot'){ui.restrictions.has(value)?ui.restrictions.delete(value):ui.restrictions.add(value);target.classList.toggle('active',ui.restrictions.has(value));target.setAttribute('aria-pressed',String(ui.restrictions.has(value)));target.textContent=ui.restrictions.has(value)?'×':'·';const day=DAYS.find(d=>value.startsWith(d.id+'_')),slot=SLOTS.find(s=>s.id===value.slice(4));target.setAttribute('aria-label',`${day.name} ${slot.start}–${slot.end}: ${ui.restrictions.has(value)?'indisponível':'disponível'}`);document.getElementById('restriction-count').textContent=`${ui.restrictions.size} horários`;captureDraft();return;}
      if(action==='restriction-day'){const keys=SLOTS.map(s=>`${value}_${s.id}`),remove=keys.every(key=>ui.restrictions.has(key));keys.forEach(key=>remove?ui.restrictions.delete(key):ui.restrictions.add(key));refreshRestrictions();return;}
      if(action==='restriction-shift'){DAYS.forEach(d=>SLOTS.filter(s=>s.id[0]===value).forEach(s=>ui.restrictions.add(`${d.id}_${s.id}`)));refreshRestrictions();return;}
      if(action==='restriction-clear'){ui.restrictions.clear();refreshRestrictions();return;}
      if(action==='download-json'){downloadJSON();return;}
      if(action==='download-saved'){closeModal();downloadJSON(true);return;}
      if(action==='import'){document.getElementById('import-file').click();return;}
      if(action==='confirm-import'){const imported=modal.imported;closeModal();ui.drafts={};ui.keepAllocations=true;ui.step='rooms';ui.search='';mutate(imported,'Cadastros carregados. As aulas existentes foram preservadas.');return;}
      if(action==='reset'){reset();return;}
      if(action==='confirm-reset'){closeModal();ui.drafts={};ui.step='rooms';ui.search='';mutate(emptyState(),'Esta base de cadastros foi limpa.');return;}
    });
    document.addEventListener('input',event=>{if(event.target.id==='non-conflict-search'){filterNonConflictOptions(event.target.value);return;}if(event.target.closest('#teaching-parts-form')){refreshTeachingPlan();return;}if(event.target.id==='join-search'){const query=normalize(event.target.value);for(const row of document.querySelectorAll('[data-join-search]'))row.hidden=!row.dataset.joinSearch.includes(query);return;}
      if(event.target.id==='record-search'){ui.search=event.target.value;const records=listRecords();document.getElementById('record-list').innerHTML=renderRecords(records);document.getElementById('list-count').textContent=String(records.length);return;}
      if(event.target.closest('#record-form')){if(['doNotAllocate','eadWeeklyHours','weeklySlotsRequired'].includes(event.target.name))refreshNonAllocationForm(event.target.closest('form'));captureDraft();if(event.target.name==='colorTheme')document.getElementById('theme-preview').innerHTML=renderThemePreview(event.target.value);}
    });
    document.addEventListener('change',event=>{if(event.target.closest('#teaching-parts-form')){refreshTeachingPlan();return;}if(event.target.name==='joinClassId'||event.target.id==='join-clear-allocations'){refreshJoinPreview();return;}
      if(event.target.id==='import-file'){importJSON(event.target.files[0]);event.target.value='';return;}
      if(event.target.id==='semester'){ui.semester=event.target.value;persistPrefs();document.getElementById('file-name').textContent=fileName();return;}
      if(event.target.id==='keep-allocations'){ui.keepAllocations=event.target.checked;persistPrefs();if(document.getElementById('json-preview').open)document.getElementById('preview-code').textContent=JSON.stringify(exportPayload(),null,2);return;}
      if(event.target.closest('#record-form')){if(['doNotAllocate','eadWeeklyHours','weeklySlotsRequired'].includes(event.target.name))refreshNonAllocationForm(event.target.closest('form'));captureDraft();if(event.target.name==='colorTheme')document.getElementById('theme-preview').innerHTML=renderThemePreview(event.target.value);}
    });
    document.addEventListener('toggle',event=>{if(event.target.id==='json-preview'&&event.target.open)document.getElementById('preview-code').textContent=JSON.stringify(exportPayload(),null,2);},true);
    document.addEventListener('submit',event=>{if(event.target.id==='record-form'){event.preventDefault();saveRecord(event.target);}});
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&modal){closeModal();return;}
      if(modal&&event.key==='Tab'){const nodes=[...modalRoot.querySelectorAll('button:not(:disabled),a[href],input,select')].filter(n=>n.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}return;}
      if(!modal&&(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();const form=document.getElementById('record-form');if(form)saveRecord(form);else downloadJSON();return;}
      if(!modal&&(event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'&&!['INPUT','SELECT','TEXTAREA'].includes(event.target.tagName)){event.preventDefault();undo();}
    });
    window.addEventListener('pagehide',()=>persistPrefs());
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistPrefs();});
    window.addEventListener('beforeunload',event=>{if(!storageOK&&(totalRecords()||pendingDrafts())){event.preventDefault();event.returnValue='';}});
    window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue)toast('Os cadastros foram alterados em outra aba. Recarregue para usar a versão mais recente.','error');});
    load();render();if(loadProblem)toast(loadProblem,'error');
  </script>
