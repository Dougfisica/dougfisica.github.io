<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Extra - Física Experimental 2</title>
  <meta name="description" content="Materiais extras de Física Experimental 2 - 1º Semestre 2026">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');

    :root {
      --base: #F8F9FA;
      --metal: #DEE2E6;
      --ink: #343A40;
      --cobalt: #0047AB;
      --neon: #00FF41;
      --safety: #FF5722;
      --glass: rgba(255, 255, 255, 0.58);
      --line: #BDC3C7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        repeating-linear-gradient(0deg, transparent 0 27px, rgba(189,195,199,.25) 27px 28px),
        repeating-linear-gradient(90deg, transparent 0 27px, rgba(189,195,199,.2) 27px 28px),
        linear-gradient(135deg, var(--base), var(--metal));
      padding: 16px;
    }

    .hud {
      position: fixed;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: #5f6b77;
      background: rgba(248, 249, 250, 0.72);
      border: 1px dashed #c6ccd2;
      border-radius: 6px;
      padding: 6px 9px;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .hud.top-right { top: 10px; right: 10px; }
    .hud.bottom-left { bottom: 10px; left: 10px; }

    .shell { max-width: 980px; margin: 0 auto; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(52, 58, 64, 0.08);
      margin-bottom: 12px;
      backdrop-filter: blur(7px);
    }

    .toolgroup { display: flex; flex-wrap: wrap; gap: 8px; }

    .toolbtn {
      font-family: 'Fira Code', monospace;
      text-decoration: none;
      color: var(--cobalt);
      border: 1px solid #b6c0c9;
      background: #eef2f5;
      padding: 8px 11px;
      border-radius: 4px;
      font-size: 12px;
    }

    .header {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 22px rgba(52,58,64,0.1);
    }

    h1 {
      font-family: 'Fira Code', monospace;
      color: var(--cobalt);
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .sub { color: #4d5760; }

    .list { display: grid; gap: 10px; }

    .item {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 16px rgba(52, 58, 64, 0.09);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .name {
      font-family: 'Fira Code', monospace;
      color: #2d3740;
      font-size: 0.87rem;
    }

    .action {
      display: inline-block;
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #111;
      background: var(--neon);
      border: 1px solid #0e9b31;
      padding: 8px 11px;
      border-radius: 4px;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    }

    .action.warn {
      background: var(--safety);
      border-color: #c53f13;
      color: #fff;
    }

    @media (max-width: 700px) {
      .hud { font-size: 10px; }
      .name { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="hud top-right">LOG_TIME: <span id="hud-time">--:--:--</span></div>
  <div class="hud bottom-left">COORD: LAB-SECTOR-FE2 :: MODE=FILES</div>

  <div class="shell">
    <nav class="toolbar" aria-label="Barra de Ferramentas">
      <div class="toolgroup">
        <a href="../fe1_1s_26.html" class="toolbtn">[ VOLTAR ]</a>
        <a href="../fe1_1s_26.html" class="toolbtn">PAINEL</a>
        <a href="notas_fe1_1s_26.html" class="toolbtn">NOTAS</a>
        <a href="cronograma_fe1_1s_26.html" class="toolbtn">CRONOGRAMA</a>
      </div>
    </nav>

    <header class="header">
      <h1>Material Extra</h1>
      <div class="sub">Arquivos técnicos de apoio da disciplina</div>
    </header>

    <main class="list">
      <article class="item">
        <div class="name">Regras Disciplina 2026.pdf</div>
        <a class="action warn" href="materiais/Regras Disciplina 2026.pdf" download>DOWNLOAD</a>
      </article>
      <article class="item">
        <div class="name">Experimento 1.pdf</div>
        <a class="action" href="materiais/Experimento 1.pdf" download>DOWNLOAD</a>
      </article>
      <article class="item">
        <div class="name">Experimento 1 Sugestão de Relatório.pdf</div>
        <a class="action" href="materiais/Experimento 1 Sugestão de Relatório.pdf" download>DOWNLOAD</a>
      </article>
    </main>
  </div>

  <script>
    const hudTime = document.getElementById('hud-time');
    function updateHudTime() {
      hudTime.textContent = new Date().toLocaleString('pt-BR', {
        hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    updateHudTime();
    setInterval(updateHudTime, 1000);
  </script>
</body>
</html>
