    .hud.bottom-left { bottom: 10px; left: 10px; }

    .panel {
      background: var(--glass);

    .subtitle {

      text-align: center;
      border-left: 5px solid var(--neon);
    }

    .status {
      margin-top: 6px;

<body>
  <div class="hud top-right">LOG_TIME: <span id="hud-time">--:--:--</span></div>
  <div class="hud bottom-left">COORD: LAB-SECTOR-LCE :: MODE=GRADES</div>

  <div class="shell">
    <nav class="toolbar" aria-label="Barra de Ferramentas">
      <div class="toolgroup">
        <a href="../fe1_lce_1s_26.html" class="toolbtn">[ VOLTAR ]</a>
        <a href="../fe1_lce_1s_26.html" class="toolbtn">PAINEL</a>
        <a href="cronograma_fe1_lce_1s_26.html" class="toolbtn">CRONOGRAMA</a>
        <a href="material_extra_fe1_lce_1s_26.html" class="toolbtn">MATERIAL</a>
      </div>
    </nav>

    <section class="panel">
      <h1>Consulta de Notas - Física Experimental 1 - LCE</h1>
      <p class="subtitle">Digite o GRR para carregar o relatório acadêmico da disciplina.</p>

      <div class="input-row">
        <div>
          <label for="grrInput">GRR (8 dígitos)</label>
          <input type="text" id="grrInput" placeholder="Ex: 20201234" maxlength="8" pattern="[0-9]*" inputmode="numeric">
        </div>
        <button class="btn" onclick="buscarNotas()">CONSULTAR</button>
      </div>

      <div id="erro" class="erro"></div>
    </section>

    <div id="resultado"></div>
  </div>

<script>
const urlsAPI = [
  "https://script.google.com/macros/s/AKfycbwTeP8M58xlEzJYB0QE8kt7EQhNEB5AkCA2IyMF7emYJ1TywDtlMEtuW8uH318osd9P/exec"
];

let avaliacoes = [];
let alunos = [];

Promise.all(urlsAPI.map(url => fetch(url).then(res => res.json())))
  .then(dadosArray => {
    dadosArray.forEach(dados => {
      dados.avaliacoes.forEach(av => {
        if (!avaliacoes.includes(av)) avaliacoes.push(av);
      });

      dados.alunos.forEach(novoAluno => {
        const alunoExistente = alunos.find(a => a.grr === novoAluno.grr);
        if (alunoExistente) {
          novoAluno.notas.forEach((nota, i) => {
            if (nota !== '-' && nota !== '') alunoExistente.notas[i] = nota;
          });
          if (novoAluno.presenca !== undefined) alunoExistente.presenca = novoAluno.presenca;
        } else {
          alunos.push(novoAluno);
        }
      });
    });
  })
  .catch(() => {
    mostrarErro('Erro ao carregar dados. Tente novamente mais tarde.');
  });

const grrInput = document.getElementById('grrInput');
grrInput.addEventListener('input', function () {
  this.value = this.value.replace(/[^0-9]/g, '');
});
grrInput.addEventListener('keypress', function (e) {
  if (e.key === 'Enter') buscarNotas();
});

function mostrarErro(msg) {
  const erro = document.getElementById('erro');
  erro.textContent = msg;
  erro.style.display = 'block';
  document.getElementById('resultado').style.display = 'none';
}

function formatarNota(nota) {
  if (nota === null || nota === undefined || nota === '-' || nota === '') return '-';
  return Number(nota).toFixed(1);
}

function calcularMedia(notas, indices) {
  const notasValidas = indices
    .map(i => parseFloat(notas[i]))
    .filter(n => !isNaN(n));
  if (notasValidas.length === 0) return '-';
  return (notasValidas.reduce((a, b) => a + b, 0) / notasValidas.length).toFixed(1);
}

function getClasseNotaFinal(nota, isExame = false) {
  if (nota === '-') return '';
  const valor = parseFloat(nota);
  if (isNaN(valor)) return '';
  if (isExame) return valor < 5 ? 'reprovado' : 'aprovado';
  if (valor < 4) return 'reprovado';
  if (valor < 7) return 'recuperacao';
  return 'aprovado';
}

function calcularStatusPresenca(presenca) {
  return presenca < 75 ? 'Reprovado por falta' : '';
}

function buscarNotas() {
  const grrNumero = grrInput.value.trim();
  const resultado = document.getElementById('resultado');
  const erro = document.getElementById('erro');

  resultado.style.display = 'none';
  erro.style.display = 'none';

  if (grrNumero.length !== 8) {
    mostrarErro('Digite os 8 números do GRR.');
    return;
  }

  const aluno = alunos.find(a => a.grr === ('GRR' + grrNumero));
  if (!aluno) {
    mostrarErro('GRR não encontrado. Verifique o número e tente novamente.');
    return;
  }

  try {
    let html = `<section class="section"><h3>Registro do GRR ${grrNumero}</h3></section>`;

    const indicesR = avaliacoes
      .map((av, i) => av.startsWith('R') ? i : -1)
      .filter(i => i !== -1);

    const indiceMediaR = avaliacoes.indexOf('Média R');
    const mediaR = indiceMediaR !== -1
      ? formatarNota(aluno.notas[indiceMediaR])
      : calcularMedia(aluno.notas, indicesR);

    html += `
      <section class="section">
        <h3>Relatórios</h3>
        <table>
          <tr><th>Avaliação</th><th>Nota</th></tr>
          ${indicesR.map(i => `<tr><td>${avaliacoes[i]}</td><td>${formatarNota(aluno.notas[i])}</td></tr>`).join('')}
          <tr><td><strong>Média R</strong></td><td><strong>${mediaR}</strong></td></tr>
        </table>
      </section>
    `;

    const indicesP = avaliacoes
      .map((av, i) => av.startsWith('P') ? i : -1)
      .filter(i => i !== -1);

    const indiceMediaP = avaliacoes.indexOf('Média P');
    const mediaP = indiceMediaP !== -1
      ? formatarNota(aluno.notas[indiceMediaP])
      : calcularMedia(aluno.notas, indicesP);

    html += `
      <section class="section">
        <h3>Provas</h3>
        <table>
          <tr><th>Avaliação</th><th>Nota</th></tr>
          ${indicesP.map(i => `<tr><td>${avaliacoes[i]}</td><td>${formatarNota(aluno.notas[i])}</td></tr>`).join('')}
          <tr><td><strong>Média P</strong></td><td><strong>${mediaP}</strong></td></tr>
        </table>
      </section>
    `;

    const fazExame = aluno.exame === 's' || aluno.exame === 'S';
    const notaFinalOriginal = formatarNota(aluno.notas[aluno.notas.length - 1]);

    if (fazExame) {
      const notaExame = formatarNota(aluno.notaExame);
      let notaFinalComExame = '-';

      if (notaFinalOriginal !== '-' && notaExame !== '-') {
        notaFinalComExame = ((parseFloat(notaFinalOriginal) + parseFloat(notaExame)) / 2).toFixed(1);
      }

      html += `
        <section class="section final-box">
          <h3>Nota Final (Semestre)</h3>
          <div class="valor">${notaFinalOriginal}</div>
        </section>
        <section class="section final-box">
          <h3>Nota do Exame</h3>
          <div class="valor">${notaExame}</div>
        </section>
        <section class="section final-box">
          <h3>Nota Final (com Exame)</h3>
          <div class="valor">${notaFinalComExame}</div>
        </section>
      `;
    } else {
      const classe = getClasseNotaFinal(notaFinalOriginal);
      const cor = classe === 'aprovado' ? '#1d7a3e' : (classe === 'recuperacao' ? '#9a5b00' : '#8b1d00');
      html += `
        <section class="section final-box">
          <h3>Nota Final</h3>
          <div class="valor" style="color:${cor}">${notaFinalOriginal}</div>
        </section>
      `;
    }

    if (aluno.presenca !== undefined) {
      const irregular = aluno.presenca < 75;
      html += `
        <section class="section presenca ${irregular ? 'irregular' : ''}">
          <h3>Frequência</h3>
          <div class="valor">${aluno.presenca.toFixed(1)}%</div>
          ${irregular ? `<div class="status">${calcularStatusPresenca(aluno.presenca)}</div>` : ''}
        </section>
      `;
    }

    resultado.innerHTML = html;
    resultado.style.display = 'block';
  } catch (e) {
    mostrarErro('Ocorreu um erro ao processar as notas.');
  }
}

const hudTime = document.getElementById('hud-time');
function updateHudTime() {
  hudTime.textContent = new Date().toLocaleString('pt-BR', {
    hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}
updateHudTime();
setInterval(updateHudTime, 1000);
</script>
</body>
