<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronograma - Física Experimental 1 - LCE (1s 2026)</title>
  <meta name="description" content="Cronograma de Física Experimental 1 - LCE - 1º Semestre 2026">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700&family=Source+Serif+4:wght@500;700&display=swap');
    :root {
      --base: #f7f2e7;
      --metal: #d7e0d5;
      --ink: #22313a;
      --cobalt: #1f6aa5;
      --neon: #9adf7f;
      --safety: #c65437;
      --glass: rgba(247, 242, 231, 0.74);
      --line: #b8b9ad;
      --board: #10221b;
      --paper-ink: #403233;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 8%, rgba(31, 106, 165, 0.15), transparent 32%),
        radial-gradient(circle at 92% 14%, rgba(154, 223, 127, 0.18), transparent 26%),
        repeating-linear-gradient(0deg, transparent 0 30px, rgba(64,50,50,.08) 30px 31px),
        linear-gradient(140deg, var(--base), #ece4d2 56%, var(--metal));
      padding: 16px;
    }

    .hud {
      position: fixed;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #5f6b77;
      background: rgba(248, 249, 250, 0.72);
      border: 1px dashed #c6ccd2;
      border-radius: 6px;
      padding: 6px 9px;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .hud.top-right { top: 10px; right: 10px; }
    .hud.bottom-left { bottom: 10px; left: 10px; }

    .shell { max-width: 1060px; margin: 0 auto; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(52, 58, 64, 0.08);
      margin-bottom: 12px;
      backdrop-filter: blur(7px);
    }

    .toolgroup { display: flex; flex-wrap: wrap; gap: 8px; }
    .toolbtn {
      font-family: 'JetBrains Mono', monospace;
      text-decoration: none;
      color: #103b2b;
      border: 1px solid #8ca896;
      background: linear-gradient(135deg, #e8f2eb, #dbe7de);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      box-shadow: inset 0 -1px 0 rgba(16,34,27,.12);
    }

    .header {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 22px rgba(52,58,64,0.1);
    }

    h1 {
      font-family: 'Source Serif 4', serif;
      color: var(--cobalt);
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .sub { color: #42535b; }

    .list { display: grid; gap: 10px; }

    .item {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 16px rgba(52, 58, 64, 0.09);
      display: grid;
      gap: 4px;
      position: relative;
    }

    .item.prova { border-left: 5px solid var(--safety); }
    .item.sem-aula { border-left: 5px solid var(--neon); }

    .date {
      font-family: 'JetBrains Mono', monospace;
      color: var(--cobalt);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .topic { color: #2f3942; font-weight: 600; padding-right: 120px; }

    .tag {
      position: absolute;
      top: 9px;
      right: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      border-radius: 4px;
      padding: 3px 7px;
      border: 1px solid #adb5bd;
      background: #eef2f5;
      color: #2f3942;
    }

    .tag.prova {
      background: var(--safety);
      color: #fff;
      border-color: #c53f13;
    }

    .tag.sem-aula {
      background: var(--neon);
      color: #111;
      border-color: #0e9b31;
    }

    @media (max-width: 700px) {
      .topic { padding-right: 0; }
      .tag { position: static; width: fit-content; margin-top: 4px; }
      .hud { font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="hud top-right">LOG_TIME: <span id="hud-time">--:--:--</span></div>
  <div class="hud bottom-left">COORD: LAB-SECTOR-LCE :: MODE=SCHEDULE</div>

  <div class="shell">
    <nav class="toolbar" aria-label="Barra de Ferramentas">
      <div class="toolgroup">
        <a href="../fe1_lce_1s_26.html" class="toolbtn">[ VOLTAR ]</a>
        <a href="../fe1_lce_1s_26.html" class="toolbtn">PAINEL</a>
        <a href="notas_fe1_lce_1s_26.html" class="toolbtn">NOTAS</a>
        <a href="material_extra_fe1_lce_1s_26.html" class="toolbtn">MATERIAL</a>
      </div>
    </nav>

    <header class="header">
      <h1>Cronograma - Física Experimental 1 - LCE</h1>
      <div class="sub">Sexta-feira | 1º semestre 2026</div>
    </header>

    <main class="list" id="cronograma-list"></main>
  </div>

  <script>
    const aulas = [
      { data: '27/fev/2026', assunto: 'Recepção' },
      { data: '06/mar/2026', assunto: 'MRUV - Carrinho puxado por um peso. Posição x tempo' },
      { data: '13/mar/2026', assunto: 'MRUV' },
      { data: '20/mar/2026', assunto: 'Vetores - Decomposição de vetores' },
      { data: '27/mar/2026', assunto: 'Vetores' },
      { data: '03/abr/2026', assunto: 'Feriado', tipo: 'sem-aula' },
      { data: '10/abr/2026', assunto: 'Lançamento de Projéteis' },
      { data: '17/abr/2026', assunto: 'Lançamento de Projéteis' },
      { data: '24/abr/2026', assunto: 'Prova 1', tipo: 'prova' },
      { data: '01/mai/2026', assunto: 'Feriado', tipo: 'sem-aula' },
      { data: '08/mai/2026', assunto: 'Segunda Lei de Newton' },
      { data: '15/mai/2026', assunto: 'Segunda Lei de Newton' },
      { data: '22/mai/2026', assunto: 'Queda Livre e conservação de energia' },
      { data: '29/mai/2026', assunto: 'Queda Livre e conservação de energia' },
      { data: '05/jun/2026', assunto: 'Feriado', tipo: 'sem-aula' },
      { data: '12/jun/2026', assunto: 'Colisões' },
      { data: '19/jun/2026', assunto: 'Jogo do Brasil', tipo: 'sem-aula' },
      { data: '26/jun/2026', assunto: 'Prova 2', tipo: 'prova' },
      { data: '03/jul/2026', assunto: 'Exame', tipo: 'prova' }
    ];

    const labels = { prova: 'PROVA', 'sem-aula': 'SEM AULA' };
    const root = document.getElementById('cronograma-list');

    root.innerHTML = aulas.map((a) => `
      <article class="item ${a.tipo || ''}">
        ${a.tipo ? `<span class="tag ${a.tipo}">${labels[a.tipo]}</span>` : ''}
        <div class="date">${a.data}</div>
        <div class="topic">${a.assunto}</div>
      </article>
    `).join('');

    const hudTime = document.getElementById('hud-time');
    function updateHudTime() {
      hudTime.textContent = new Date().toLocaleString('pt-BR', {
        hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    updateHudTime();
    setInterval(updateHudTime, 1000);
  </script>
</body>
</html>
