<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bio1 - Cartoon com webcam</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111417;
      color: #e8edf2;
      font-family: Arial, Helvetica, sans-serif;
    }

    #viewer {
      position: fixed;
      left: 0;
      top: 0;
      width: 50vw;
      height: 100vh;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }

    #webcam-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 50vw;
      height: 100vh;
      background: #050607;
    }

    #webcam, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    #webcam {
      transform: scaleX(-1);
    }

    #error {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: min(680px, calc(100vw - 32px));
      padding: 16px 18px;
      display: none;
      background: #2a1111;
      border: 1px solid #e05c5c;
      color: #fff2f2;
      font-size: 15px;
      line-height: 1.45;
    }

    #molecule-title {
      position: fixed;
      left: 14px;
      top: 14px;
      padding: 9px 12px;
      background: rgba(11, 14, 17, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 22px;
      line-height: 1.1;
      font-weight: 700;
      max-width: calc(50vw - 28px);
    }

  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="molecule-title">Proteína ACE, com ligante lisinopril</div>
  <div id="webcam-panel">
    <video id="webcam" playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="error"></div>

  <script>
    const errorEl = document.getElementById("error");
    const videoEl = document.getElementById("webcam");
    const canvasEl = document.getElementById("overlay");
    const canvasCtx = canvasEl.getContext("2d");

    let viewer;
    let activeGrab = null;
    let previousPinch = null;
    let activeController = null;
    const CONTROLLER_LOCK_MS = 1200;
    const CONTROLLER_MAX_JUMP = 0.28;

    function showError(message) {
      errorEl.style.display = "block";
      errorEl.textContent = message;
    }

    function resizeCanvas() {
      const rect = canvasEl.getBoundingClientRect();
      canvasEl.width = Math.max(1, Math.round(rect.width));
      canvasEl.height = Math.max(1, Math.round(rect.height));
    }

    function isFistClosed(landmarks) {
      const fingers = [[8, 6], [12, 10], [16, 14], [20, 18]];
      let folded = 0;
      for (const [tip, pip] of fingers) {
        if (landmarks[tip].y > landmarks[pip].y) folded += 1;
      }
      return folded >= 3;
    }

    function handCenter(landmarks) {
      return {
        x: 0.5 * (landmarks[0].x + landmarks[9].x),
        y: 0.5 * (landmarks[0].y + landmarks[9].y)
      };
    }

    function handSize(landmarks) {
      let minX = 1;
      let minY = 1;
      let maxX = 0;
      let maxY = 0;
      for (const landmark of landmarks) {
        minX = Math.min(minX, landmark.x);
        minY = Math.min(minY, landmark.y);
        maxX = Math.max(maxX, landmark.x);
        maxY = Math.max(maxY, landmark.y);
      }
      return Math.hypot(maxX - minX, maxY - minY);
    }

    function pinchState(landmarks) {
      const thumb = landmarks[4];
      const index = landmarks[8];
      const distance = Math.hypot(thumb.x - index.x, thumb.y - index.y);
      return {
        active: distance < 0.065,
        distance,
        center: {
          x: 0.5 * (thumb.x + index.x),
          y: 0.5 * (thumb.y + index.y)
        }
      };
    }

    function mirrorLandmark(landmark) {
      return {...landmark, x: 1 - landmark.x};
    }

    function mirrorLandmarks(landmarks) {
      return landmarks.map(mirrorLandmark);
    }

    function toCanvasPoint(landmark) {
      return {
        x: (1 - landmark.x) * canvasEl.width,
        y: landmark.y * canvasEl.height
      };
    }

    function rotateWithHand(current) {
      if (!current.closed) {
        activeGrab = null;
        return;
      }

      if (!activeGrab) {
        activeGrab = {
          center: {...current.center},
          view: viewer.getView().slice()
        };
        previousPinch = null;
        return;
      }

      const dx = current.center.x - activeGrab.center.x;
      const dy = current.center.y - activeGrab.center.y;
      viewer.setView(activeGrab.view.slice());
      if (Math.abs(dx) > 0.004) viewer.rotate(-dx * 170, "y");
      if (Math.abs(dy) > 0.004) viewer.rotate(dy * 170, "x");
      viewer.render();
      previousPinch = null;
    }

    function zoomWithPinch(current) {
      if (!current.pinch.active || current.closed) {
        previousPinch = null;
        return;
      }
      if (previousPinch) {
        const dy = current.pinch.center.y - previousPinch.center.y;
        if (Math.abs(dy) > 0.004) {
          const factor = Math.exp(-dy * 4.0);
          if (factor > 0.85 && factor < 1.18) {
            viewer.zoom(factor);
            viewer.render();
          }
        }
      }
      previousPinch = current.pinch;
      activeGrab = null;
    }

    function applyGesture(current) {
      if (current.closed) {
        rotateWithHand(current);
        return;
      }
      if (current.pinch.active) {
        zoomWithPinch(current);
        return;
      }
      activeGrab = null;
      previousPinch = null;
    }

    function hasControlGesture(hand) {
      return hand.closed || hand.pinch.active;
    }

    function handDistance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function chooseController(detected) {
      const now = performance.now();
      const locked = activeController && now - activeController.lastGestureAt < CONTROLLER_LOCK_MS;

      if (locked) {
        let closest = null;
        let closestDistance = Infinity;
        for (const hand of detected) {
          const distance = handDistance(hand.center, activeController.center);
          if (distance < closestDistance) {
            closest = hand;
            closestDistance = distance;
          }
        }
        if (closest && closestDistance < CONTROLLER_MAX_JUMP) {
          activeController.center = {...closest.center};
          if (hasControlGesture(closest)) activeController.lastGestureAt = now;
          return closest;
        }
      }

      const candidates = detected.filter(hasControlGesture);
      if (!candidates.length) {
        if (!locked) activeController = null;
        return null;
      }

      let best = null;
      let bestScore = -Infinity;
      for (const hand of candidates) {
        const distanceToCenter = handDistance(hand.center, {x: 0.5, y: 0.5});
        const score = hand.size * 2.2 - distanceToCenter * 0.8;
        if (score > bestScore) {
          best = hand;
          bestScore = score;
        }
      }

      activeController = {
        center: {...best.center},
        lastGestureAt: now
      };
      return best;
    }

    async function loadProtein() {
      viewer = $3Dmol.createViewer("viewer", {
        backgroundColor: "#111417",
        antialias: true
      });

      const response = await fetch("1o86_processed.pdb");
      if (!response.ok) throw new Error("Nao foi possivel carregar 1o86_processed.pdb");
      const pdb = await response.text();

      viewer.addModel(pdb, "pdb");
      viewer.setStyle({}, {
        cartoon: {
          color: "spectrum",
          thickness: 0.55,
          arrows: true,
          tubes: true
        }
      });
      viewer.addStyle({hetflag: true}, {
        stick: {radius: 0.18, colorscheme: "Jmol"},
        sphere: {scale: 0.34, colorscheme: "Jmol"}
      });
      viewer.zoomTo();
      viewer.render();
      window.addEventListener("resize", () => {
        if (viewer && typeof viewer.resize === "function") {
          viewer.resize();
          viewer.render();
        }
      });
    }

    async function startHands() {
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const hands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 4,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.55
      });

      hands.onResults(results => {
        resizeCanvas();
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasEl.width, canvasEl.height);
        const detected = [];
        const rawHands = results.multiHandLandmarks || [];

        if (rawHands.length) {
          for (const landmarks of rawHands) {
            const mirrored = mirrorLandmarks(landmarks);
            drawConnectors(canvasCtx, mirrored, HAND_CONNECTIONS, {color: "#00d084", lineWidth: 3});
            drawLandmarks(canvasCtx, mirrored, {color: "#f5f141", lineWidth: 1, radius: 2});

            const center = handCenter(landmarks);
            const closed = isFistClosed(landmarks);
            const pinch = pinchState(landmarks);
            const size = handSize(landmarks);
            const hand = {center, closed, pinch, size};
            detected.push(hand);

            const x = (1 - center.x) * canvasEl.width;
            const y = center.y * canvasEl.height;
            const label = closed ? "FECHADA" : (pinch.active ? "PINCA" : "ABERTA");
            canvasCtx.fillStyle = closed ? "#5cff70" : (pinch.active ? "#63a7ff" : "#f5f141");
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 7, 0, Math.PI * 2);
            canvasCtx.fill();
            if (pinch.active && !closed) {
              const thumb = toCanvasPoint(landmarks[4]);
              const index = toCanvasPoint(landmarks[8]);
              canvasCtx.strokeStyle = "#63a7ff";
              canvasCtx.lineWidth = 5;
              canvasCtx.beginPath();
              canvasCtx.moveTo(thumb.x, thumb.y);
              canvasCtx.lineTo(index.x, index.y);
              canvasCtx.stroke();
            }
            canvasCtx.font = "bold 15px Arial";
            canvasCtx.fillText(label, x + 12, y + 5);
          }
        }

        canvasCtx.restore();

        const controller = chooseController(detected);

        if (!viewer) return;
        if (controller) applyGesture(controller);
        else {
          activeGrab = null;
          previousPinch = null;
        }
      });

      const camera = new Camera(videoEl, {
        onFrame: async () => {
          await hands.send({image: videoEl});
        },
        width: 640,
        height: 480
      });
      await camera.start();
    }

    (async () => {
      try {
        await loadProtein();
        await startHands();
      } catch (error) {
        showError(String(error && error.message ? error.message : error));
      }
    })();
  </script>
</body>
</html>
